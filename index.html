<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empress Decrees - box prototype (batch 8)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1620;color:#f3e6c8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;left:12px;top:10px;font:16px Georgia,serif;text-shadow:0 1px 3px #000;pointer-events:none}
#next{position:fixed;right:12px;top:10px;font:14px system-ui,sans-serif;text-align:right;text-shadow:0 1px 3px #000;pointer-events:none;max-width:45vw}
#banner{position:fixed;left:50%;top:13%;transform:translateX(-50%);text-align:center;pointer-events:none;display:none;max-width:92vw;text-shadow:0 2px 4px #000}
#banner .voice{font:italic 24px Georgia,serif;color:#ffd98a}
#banner .rule{font:15px system-ui,sans-serif;color:#fff;margin-top:6px}
#dbg{position:fixed;left:12px;bottom:10px;font:12px monospace;display:none;pointer-events:none;text-shadow:0 1px 2px #000}
#help{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);font:13px system-ui,sans-serif;opacity:.85;pointer-events:none;text-align:center;text-shadow:0 1px 2px #000}
#btnMap{position:fixed;right:12px;bottom:12px;min-width:64px;min-height:44px;font:15px system-ui,sans-serif;background:#3a2a3a;color:#fff;border:1px solid #b99;border-radius:8px}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #fff8;display:none;pointer-events:none}
#err{position:fixed;inset:0;background:#2a0b0b;color:#fff;padding:20px;display:none;font:14px monospace;white-space:pre-wrap;z-index:9}
#hp{position:fixed;left:12px;top:36px;width:180px;height:14px;background:#0008;border:1px solid #fff6;border-radius:3px;pointer-events:none}
#hpfill{height:100%;width:100%;background:#d23b3b;border-radius:2px}
#hptext{position:absolute;left:6px;top:-1px;font:12px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
#mini{position:fixed;right:10px;bottom:10px;border:2px solid #b99;border-radius:4px;background:#0c0a10}
body.touch #mini{right:auto;left:10px;top:10px;bottom:auto}
body.touch #hud{top:auto;left:auto;right:12px;top:40px}
body.touch #hp{left:auto;right:12px;top:62px}
body.touch #next{top:10px;right:12px}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px}
.sk{position:relative;width:52px;height:52px;border-radius:8px;background:#2a2030;border:2px solid #c9a040;color:#fff;font:bold 16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sk .cd{position:absolute;inset:0;background:#000a;border-radius:6px;display:none;align-items:center;justify-content:center;font:bold 18px system-ui}
.sk .ch{position:absolute;inset:-6px;border-radius:inherit;z-index:-1;display:none;pointer-events:none}
.sk .lb{position:absolute;bottom:-15px;font:11px system-ui;color:#ddd;white-space:nowrap}
body.touch #bar{left:auto;right:18px;bottom:18px;transform:none;width:230px;height:200px;display:block}
body.touch .sk{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:auto;touch-action:none}
body.touch .sk.atk{width:88px;height:88px;right:0;bottom:0;font-size:15px}
body.touch .sk .lb{display:none}
#boss{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(46vw,420px);display:none;pointer-events:none;text-align:center;text-shadow:0 1px 2px #000}
#bossname{font:15px Georgia,serif;color:#ffd98a}
#bossbar{height:12px;background:#0008;border:1px solid #fff6;border-radius:3px;margin:3px 0}
#bossfill{height:100%;width:100%;background:#e0662a;border-radius:2px}
#bossskills{font:12px system-ui,sans-serif;color:#fff}
#status{position:fixed;left:12px;top:56px;font:bold 13px system-ui,sans-serif;color:#ffb0a0;text-shadow:0 1px 2px #000;pointer-events:none}
#btnHunt{position:fixed;left:12px;bottom:40px;min-width:120px;min-height:44px;font:15px system-ui,sans-serif;background:#5a1a1a;color:#fff;border:1px solid #f88;border-radius:8px;display:none}
body.touch #help{bottom:12px}
body.touch #btnHunt{left:160px;top:10px;bottom:auto}
body.touch #status{left:auto;right:12px;top:82px}
#leader{position:fixed;left:12px;top:34px;font:bold 13px system-ui,sans-serif;color:#ffd75a;text-shadow:0 1px 2px #000;pointer-events:none;display:none}
body.touch #leader{left:auto;right:12px;top:61px}
#decree{position:fixed;left:12px;top:76px;font:bold 13px system-ui,sans-serif;color:#ffe08a;text-shadow:0 1px 2px #000;pointer-events:none;display:none}
body.touch #decree{left:auto;right:12px;top:103px}
#school{position:fixed;left:12px;top:96px;font:bold 13px system-ui,sans-serif;color:#cfe3ff;text-shadow:0 1px 2px #000;pointer-events:none}
body.touch #school{left:auto;right:12px;top:124px}
#select{position:fixed;inset:0;display:none;background:#120d16;z-index:8;overflow:auto}
.sel__box{max-width:720px;margin:0 auto;padding:24px 16px;text-align:center}
.sel__title{font:italic 26px Georgia,serif;color:#ffd98a}
.sel__rule{font:14px system-ui,sans-serif;color:#ddd;margin:8px 0 16px}
.sel__list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sel__btn{min-width:44px;min-height:44px;padding:10px;font:15px system-ui,sans-serif;color:#fff;background:#2a2030;border:2px solid #6a5a7a;border-radius:8px}
.sel__btn.is-last{border-color:#c9a040}
.sel__btn--random{grid-column:1/-1;background:#3a2a1a}
#bar.silenced .skill{opacity:.35;border-color:#888}
body.touch #banner{top:26%}
#cancel{position:fixed;right:20px;top:90px;width:90px;height:56px;border-radius:10px;background:#5a1a1a;color:#fff;font:15px system-ui;display:none;align-items:center;justify-content:center;border:2px solid #f88}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<div id="hud"></div>
<div id="hp"><div id="hpfill"></div><span id="hptext"></span></div>
<div id="next"></div>
<div id="banner"><div class="voice"></div><div class="rule"></div></div>
<div id="dbg"></div>
<div id="help"></div>
<button id="btnMap"></button>
<canvas id="mini"></canvas>
<div id="bar"></div>
<div id="cancel"></div>
<div id="stick"></div>
<div id="boss"><div id="bossname"></div><div id="bossbar"><div id="bossfill"></div></div><div id="bossskills"></div></div>
<div id="status"></div>
<div id="leader"></div>
<div id="decree"></div>
<div id="school"></div>
<div id="select"><div class="sel__box"><div class="sel__title"></div><div class="sel__rule"></div><div class="sel__list"></div></div></div>
<button id="btnHunt"></button>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';

// ===================== CONFIG (all tunables) =====================
const CONFIG = {
  // Fixed logic step in seconds (60 steps per second).
  STEP: 1 / 60,
  // Largest frame delta accepted, seconds.
  MAX_DT: 0.05,
  // Player walk speed, metres per second.
  PLAYER_SPEED: 6,
  // Player body radius used for the edge clamp and walls, metres.
  PLAYER_RADIUS: 0.45,
  // Player body height used for walls and overhangs, metres.
  BODY_HEIGHT: 2.0,
  // Highest step the player walks up without a ramp, metres.
  STEP_UP: 0.6,
  // Map size multiplier for all layout positions (user approved 1.5x on 23 Nov). Props keep their size.
  MAP_SCALE: 1.5,
  // Player maximum health.
  MAX_HP: 100,
  // Drops at least this high hurt on landing, metres.
  DROP_MIN: 2.5,
  // Damage from a drop to the layer below.
  DROP_DAMAGE: 8,
  // How fast knockback fades, per second.
  KB_DECAY: 6,
  // Tiger statue: trigger range, strike radius, tell, cooldown, damage, knockback speed (m, m, s, s, hp, m/s).
  STATUE: { range: 6, radius: 6.5, windup: 0.6, cooldown: 3, dmg: 30, kb: 14 },
  // Stone lions: trigger range, strike radius, tell, cooldown, damage, knockback speed.
  LION: { range: 3.5, radius: 4, windup: 0.6, cooldown: 4, dmg: 20, kb: 11 },
  // Healing altars: radius (m), heal per second, heal stored per charge, seconds empty, seconds a hit pauses healing.
  ALTAR: { radius: 2.2, rate: 8, charge: 40, emptyS: 30, hitPauseS: 2 },
  // Vision radius around the player (fog of war): terrain beyond is dimmed, units beyond are hidden, metres.
  VISION_R: 11,
  // Brightness of terrain outside vision (0 black, 1 no dimming).
  FOW_DIM: 0.35,
  // Basic attack placeholder: range (m), seconds between hits, damage, auto-target search range (m).
  ATTACK: { range: 2.5, interval: 0.8, dmg: 10, acquire: 8 },
  // Placeholder skills for aiming tests until the kits arrive. type: line, circle or self; delay = telegraph before the hit (s).
  // tag (batch 16, common skill interface) tells the bot brain how to use a skill: 'poke' = cast at a target in range, 'dashIn' = close in from
  // BOT.dashMinM to BOT.dashMaxM, 'ult' = keep it to finish a target or use it under BOT.ultBelowHp. Slot keys (Q W R) are the same for every kit.
  SKILLS: [
    { key: 'KeyQ', label: 'Q', name: 'Line', type: 'line', range: 8, width: 1.5, dmg: 25, cd: 6, delay: 0, tag: 'poke' },
    // W (panel, 23 Nov 15:11, batch 12): a placeholder Dash until the kits: dashes range metres toward the aim point over dashS seconds by the walking rule
    // (rails, walls and the void stop it), then its burst of radius hits on landing. dash: true marks it for the no-dash decree.
    { key: 'KeyW', label: 'W', name: 'Dash', type: 'dash', range: 4, radius: 2.5, dmg: 20, cd: 8, delay: 0, dash: true, dashS: 0.2, tag: 'dashIn' },
    { key: 'KeyR', label: 'R', name: 'Ultimate', type: 'circle', range: 9, radius: 4, dmg: 60, cd: 30, delay: 1, tag: 'ult' },
  ],
  // Training dummies to aim at (map test only): x, z before MAP_SCALE, section.
  DUMMIES: [[-36, 12, 'W2'], [0, -12, 'C1'], [6, 2, 'C2']],
  // Dummy health.
  DUMMY_HP: 100,
  // Seconds before a broken dummy stands again.
  DUMMY_RESPAWN_S: 3,
  // Minimap width on desktop, pixels.
  MINI_W: 200,
  // Minimap width on phone, pixels.
  MINI_W_TOUCH: 140,
  // Minimap redraws per second.
  MINI_HZ: 15,
  // Pathfinding grid cell size, metres.
  NAV_CELL: 1,
  // Most cells one path search may open.
  NAV_MAX: 15000,
  // Seconds between move orders while the right mouse button is held.
  REPATH_S: 0.15,
  // Phone skill drag: pixels of drag for full range.
  DRAG_FULL_PX: 80,
  // Phone skill drag: pixels before a touch counts as a drag (shorter = tap = auto-aim).
  DRAG_MIN_PX: 14,
  // Index into SPAWNS where the player starts.
  PLAYER_SPAWN: 2,
  // Where the player reappears after falling (map batch only), x then z in metres.
  RESPAWN_XZ: [0, -14],
  // Seconds of falling before the respawn.
  RESPAWN_S: 1.2,
  // Game seconds before the first collapse wave lands.
  FIRST_WAVE_S: 60,
  // Game seconds between collapse waves.
  WAVE_INTERVAL_S: 40,
  // Seconds a section glows before it falls (fairness tell, must stay >= 0.4).
  COLLAPSE_WARN_S: 5,
  // Seconds the fall animation lasts before the section leaves the scene.
  COLLAPSE_FALL_S: 1.2,
  // Fall acceleration for sections and the player, metres per second squared.
  GRAVITY: 20,
  // Collapse order, one inner list per wave (section ids). Matching voice line: TEXT.voice_wave<N>.
  WAVES: [['ROOF'], ['WB2', 'EB2'], ['W2', 'E2'], ['W1', 'WB1', 'E1', 'EB1'], ['C2']],
  // Camera pitch above the ground in follow view, degrees (user chose 40 on 23 Nov; was 55).
  CAM_PITCH_DEG: 40,
  // Camera distance from the player in follow view, metres (user chose 14 on 23 Nov; was 24).
  CAM_DIST: 14,
  // Camera field of view, degrees.
  CAM_FOV: 50,
  // Fog start in follow view, metres.
  FOG_NEAR: 45,
  // Fog end in follow view, metres.
  FOG_FAR: 85,
  // Camera far plane in follow view, metres.
  FAR_FOLLOW: 90,
  // Camera far plane in map overview, metres.
  FAR_OVERVIEW: 220,
  // Overview camera position before MAP_SCALE, x y z metres.
  OVERVIEW_POS: [0, 105, 32],
  // Below this height a falling player counts as lost, metres.
  VOID_Y: -12,
  // Frame time that counts as slow for the tier step-down, milliseconds.
  STEPDOWN_MS: 20,
  // Seconds of slow frames before stepping down a tier.
  STEPDOWN_HOLD_S: 2,
  // Quality tiers: pixel ratio cap, shadows, shadow map size. There is no high tier.
  TIER: {
    medium: { pr: 1.25, shadows: true, shadowMap: 2048 },
    low: { pr: 1.0, shadows: false, shadowMap: 512 },
  },
  // Default quality tier.
  DEFAULT_TIER: 'medium',
  // Colours.
  COL: {
    sky: 0x2a2233, skyLight: 0xd9c9ff, groundLight: 0x3a2a22, sun: 0xffe2b8, abyss: 0x0f0b12,
    coreFloor: 0x5a4632, court: 0x8a8378, bridge: 0x6b4a2e, roof: 0x2f5a4e, wall: 0x7a1e1e,
    pillar: 0x9a2a22, silk: 0xb0303c, gold: 0xc9a040, bronze: 0x4a3a2a, empress: 0xf0e2c0,
    camp: 0xff8a2a, spawn: 0xe8e8e8, player: 0x3a7bd5, aim: 0xffffff, blob: 0x000000, warn: 0xff2a10,
    stone: 0x9a968c, eyes: 0xff3a1a, ring: 0xff2a10, altarOn: 0x5cff9a, altarOff: 0x2a3a30, broken: 0x2a2624, dummy: 0xc8b070, hit: 0xffffff, ind: 0x7fd0ff, fx: 0xffd060,
    schools: [0xb05a2a, 0xd5a03a, 0x6a6a6a, 0x8a2a3a, 0x3a3a3a, 0xe8e8f0, 0xc060a0, 0x40c0c0, 0x9a6ad5],
    demon: 0x9a5a22, stalker: 0x7a2a8a, howler: 0x2a7a8a, frenzy: 0xff5a1a, tellD: 0xff2a10, tellS: 0xd050ff, tellH: 0x40e0ff, crab: 0xe07030, wander: 0x9adf9a,
  },
  // Feature switch: the apex hunt on boxes (Tiger Demon, 2 minions, skill transfer). Started by H or the Hunt button until the royale exists.
  APEX_HUNT: true,
  // Apex phase: wake seconds, player entry x z and gate seal line z (before MAP_SCALE), plate flight seconds, seconds between enemy skills, seconds an enemy rests after a move.
  APEX: { wakeS: 3, entry: [0, -29], gateZ: -26.6, plateS: 0.9, skillGap: 1.2, recoverS: 0.25 },
  // Tiger Demon: health, speed (m/s), hit radius (m), body scale, distance it closes to (m), start offset from the statue x z (m).
  DEMON: { hp: 1000, speed: 4.6, r: 0.9, scale: 1, keep: 1.8, off: [0, 0] },
  // Stalker minion: same fields. Cubs and minions are treaded four-legged machines, faster than most suits (owner, 23 Nov); their other numbers sit at the suits' median.
  STALKER: { hp: 120, speed: 6.6, r: 0.5, scale: 0.5, keep: 1.1, off: [-4.5, 3] },
  // Howler minion: same fields, plus flank = how far behind the player (away from the demon) it tries to stand (m).
  HOWLER: { hp: 100, speed: 6.6, r: 0.5, scale: 0.5, keep: 0.5, off: [4.5, 3], flank: 1.2 },
  // Demon ultimate "Shed the limit". mode: 'once50' = one use at or below half health, 'cooldown' = repeats every cd seconds. windup = tell (s), dur = frenzy length (s), speed and dmg = multipliers.
  DEMON_ULT: { mode: 'once50', windup: 0.8, dur: 8, speed: 1.4, dmg: 1.3, cd: 40 },
  // Enemy moves. shape: circle (around the user), line (dash strip), spot (circle at a point locked behind the player). windup = tell in seconds (fairness: never under 0.4).
  // min, max = distance band to the player in which the move starts (m). cd = cooldown (s). dashS = dash travel time (s). slow = speed cut (0-1) for slowS seconds. stun in seconds. bleed = stacks added.
  MOVES: {
    claw: { shape: 'circle', radius: 2.6, windup: 0.45, cd: 1.6, dmg: 12, min: 0, max: 2.2 },
    pounce: { shape: 'line', range: 7.5, width: 2.2, windup: 0.5, cd: 6, dmg: 18, min: 3.5, max: 7.5, dashS: 0.18 },
    roar: { shape: 'circle', radius: 6, windup: 0.7, cd: 11, dmg: 0, min: 0, max: 5, slow: 0.4, slowS: 2 },
    bite: { shape: 'circle', radius: 1.7, windup: 0.4, cd: 1.4, dmg: 5, min: 0, max: 1.4 },
    lunge: { shape: 'line', range: 4.5, width: 1.4, windup: 0.45, cd: 5, dmg: 10, min: 2, max: 4.5, dashS: 0.15 },
    rend: { shape: 'circle', radius: 1.9, windup: 0.5, cd: 7, dmg: 4, min: 0, max: 1.5, bleed: 1 },
    flank: { shape: 'spot', back: 1.6, radius: 2.2, windup: 0.6, cd: 8, dmg: 6, min: 2.5, max: 6, dashS: 0.2, stun: 0.6 },
    howl: { shape: 'circle', radius: 7.5, windup: 0.7, cd: 12, dmg: 0, min: 0, max: 6.5, slow: 0.2, slowS: 3 },
  },
  // Bleed on the player: damage per second per stack, seconds it lasts (each new stack refreshes it), most stacks.
  BLEED: { dps: 2, dur: 4, max: 3 },
  // Feature switch: royale minions (cubs at the camps, plate reward).
  ROYALE_MINIONS: true,
  // Kennel waves: seconds to the first wave, seconds between waves, warning seconds (banner and map ring), and per wave a list of [kind, index into CAMPS]. CAMPS order: W1, E1, roof, C2.
  KENNEL: { firstS: 30, intervalS: 60, warnS: 5, waves: [[['stalker', 0]], [['stalker', 0], ['howler', 1]], [['stalker', 3], ['howler', 1]], [['stalker', 3], ['howler', 3]]] },
  // Cubs: health and damage scale against the apex minions, aggro radius (m), leash radius from the camp (m), heal per second at rest, seconds before a returning cub is put back on its camp, pool sizes.
  CUB: { hpK: 0.8, dmgK: 0.6, aggro: 6, leash: 12, heal: 25, homeMaxS: 6, stalkers: 4, howlers: 3 },
  // Plate reward (two slots): buff seconds, bleed dps and seconds on targets (Stalker plate), speed bonus (Howler plate), plate flight seconds. Its ultimate charge is ULT.plate.
  PLATE: { buffS: 45, bleedDps: 4, bleedS: 3, speed: 0.1, flyS: 0.7 },
  // Feature switch: buff creatures (crab and wanderer), drawn from marble bags.
  NEUTRALS: true,
  // Marble bags (draw without putting back; refill and reshuffle when empty). times = seconds until a creature appears (from the run start, then from its death);
  // spots = x, z before MAP_SCALE, section; crab and wander = which boon; amounts = boon size multiplier.
  BAGS: {
    times: [25, 35, 45, 55],
    spots: [[-36, 16, 'W2'], [36, 16, 'E2'], [-34, -10, 'W1'], [34, -10, 'E1'], [0, -9, 'C1'], [-6, -3, 'C2']],
    crab: ['ult', 'power', 'heal'],
    wander: ['regen', 'vision', 'speed'],
    amounts: [0.5, 1, 1, 1.5],
  },
  // Crab: health, body radius, box scale, scuttle distance (m) and rate. It never attacks.
  CRAB: { hp: 110, r: 0.7, scale: 1, roam: 2, rate: 0.8 },
  // Wanderer: health, body radius, box scale, circle radius (m) and rate. It never attacks.
  WANDERER: { hp: 70, r: 0.5, scale: 1, roam: 2.5, rate: 0.6 },
  // Boons at amount 1 (the bag multiplies v). ult: ultimate charge points (batch 15). power: damage bonus. heal: health. regen: health per second. vision: metres. speed: speed bonus. s = seconds.
  BOONS: { ult: { v: 20 }, power: { v: 0.1, s: 40 }, heal: { v: 20 }, regen: { v: 2, s: 20 }, vision: { v: 3, s: 40 }, speed: { v: 0.08, s: 30 } },
  // Highest total multiplier any stack of bonuses may reach (speed, damage).
  BONUS_CAP: 1.4,
  // Ultimate charge (batch 15, panel note 15, owner go 23 Nov 21:45): R casts only with a full meter and empties it; no cooldown in the royale.
  // The wake fills the meter and the hunt keeps the old R cooldown (SKILLS[2].cd). Gains only in the royale, only while alive; the ult2x decree multiplies every gain by DECREES.ultK.
  // The crab's ult boon gives BOONS.ult.v x its drawn amount.
  ULT: {
    // Charge needed to cast R (the full meter).
    full: 100,
    // Charge every suit has at the start of a run.
    start: 0,
    // Charge per second while alive.
    passive: 0.5,
    // Charge per point of health dealt to another suit.
    dealt: 0.25,
    // Charge per point of health taken (any cause).
    taken: 0.1,
    // Charge for breaking a suit.
    kill: 20,
    // Charge for a cub's plate.
    plate: 30,
    // Charge for claiming the bounty (fills the meter).
    bounty: 100,
  },
  // Schools of the match (batch 16; owner 23 Nov 20:03 nine schools; order = docs/SUITS.md table). The player picks one (or a random one); the bots take
  // the other eight in this order. Index 0 (ru) is the default pick, so the bots keep the order Dao..Nong when nothing was picked (tests, first run).
  SCHOOLS: ['ru', 'dao', 'fa', 'mo', 'yinyang', 'za', 'ming', 'zongheng', 'nong'],
  // Suit stats (batch 16, docs/STATS-MATH.md, owner 23 Nov 23:3x "use it as written"): damage a suit takes from suits and creatures (causes hit and bleed)
  // = raw x (K + armor[yard]) / (K + its armor); statue, lions, drops and the void stay fixed. HP 100 for every suit (MAX_HP).
  // Mid is the yardstick: every damage number in CONFIG is what a Mid suit takes, so a Mid suit takes it unchanged.
  STATS: {
    // Armor constant K (League-style: armor K halves damage).
    K: 100,
    // Armor per toughness tier (Low 17%, Mid 29%, High 41% less than no armor).
    armor: { Low: 20, Mid: 40, High: 70 },
    // Walk speed per speed tier, metres per second (Mid equals PLAYER_SPEED; cubs and minions stay faster at 6.6).
    speed: { Low: 5.6, Mid: 6, High: 6.4 },
    // The tier every damage number is written for.
    yard: 'Mid',
  },
  // Kits per school (batch 16 framework; skills per docs/SUITS.md come in tickets 02-10). built = the school plays its own kit and stats;
  // until then it plays the placeholder kit (ATTACK, SKILLS) at Mid stats. armor and speed = tiers from the docs/SUITS.md table (HP column = toughness).
  // ultMode = how its R unlocks: 'charge' (the ULT meter); 'lock' (Yinyang) and 'counters' (Dao) are built with their kits.
  KITS: {
    // 儒甲 Junzi: fighter.

const textCache = new Map();
const showCache = new Map();
function setText(node, s) {
  if (textCache.get(node) !== s) { textCache.set(node, s); node.textContent = s; }
}
function setBar(node, frac) {
  const w = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
  if (textCache.get(node) !== w) { textCache.set(node, w); node.style.width = w; }
}
// The ultimate's charge ring: a gold arc over pct percent of the circle (written only on change).
function setRing(node, pct) {
  const v = 'conic-gradient(#ffd060 ' + pct + '%, #0000 0)';
  if (textCache.get(node) !== v) { textCache.set(node, v); node.style.background = v; }
}
function setShow(node, on) {
  if (showCache.get(node) !== on) { showCache.set(node, on); node.style.display = on ? 'block' : 'none'; }
}
function T(key, vars) {
  const s = TEXT[key];
  if (s === undefined) throw new Error('Missing text key: ' + key);
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => vars[k]);
}

function box(w, h, d, x, y, z) { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g; }

function mergeGeoms(list) {
  let nv = 0, ni = 0;
  for (const g of list) { nv += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
  const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  let vo = 0, io = 0;
  for (const g of list) {
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    if (g.index) { const a = g.index.array; for (let i = 0; i < a.length; i++) idx[io + i] = a[i] + vo; io += a.length; }
    else { for (let i = 0; i < c; i++) idx[io + i] = vo + i; io += c; }
    vo += c; g.dispose();

  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));

function botAwayGoal(b, s) {

  let best = -1, bd = Math.hypot(b.x - s.x, b.z - s.z);

function botAltar(b) {

function botFollow(b) {
