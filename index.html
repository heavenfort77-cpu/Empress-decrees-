body.touch #mini{right:auto;left:10px;top:10px;bottom:auto}
body.touch #hud{top:auto;left:auto;right:12px;top:40px}

// ===================== DOM helpers (writes only on change) =====================
const $ = (id) => document.getElementById(id);
const el = {
  hud: $('hud'), next: $('next'), banner: $('banner'), dbg: $('dbg'), help: $('help'),

  voice: document.querySelector('#banner .voice'), rule: document.querySelector('#banner .rule'),
};
const textCache = new Map();
const showCache = new Map();
function setText(node, s) {
  if (textCache.get(node) !== s) { textCache.set(node, s); node.textContent = s; }
}
function setBar(node, frac) {
  const w = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
  if (textCache.get(node) !== w) { textCache.set(node, w); node.style.width = w; }
}
function setShow(node, on) {
  if (showCache.get(node) !== on) { showCache.set(node, on); node.style.display = on ? 'block' : 'none'; }
}
function T(key, vars) {
  const s = TEXT[key];
  if (s === undefined) throw new Error('Missing text key: ' + key);
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, (m, k) => vars[k]);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.prepend(renderer.domElement);

const COL = CONFIG.COL;
const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.sky, CONFIG.FOG_NEAR, CONFIG.FOG_FAR);
const camera = new THREE.PerspectiveCamera(CONFIG.CAM_FOV, innerWidth / innerHeight, 0.5, CONFIG.FAR_FOLLOW);

const hemi = new THREE.HemisphereLight(COL.skyLight, COL.groundLight, 1.1);
const sun = new THREE.DirectionalLight(COL.sun, 2.2);
sun.position.set(-30, 60, 25);
sun.target.position.set(0, 0, -12);
sun.castShadow = true;
const sc = sun.shadow.camera;
const SHK = CONFIG.MAP_SCALE;
sc.left = -58 * SHK; sc.right = 58 * SHK; sc.top = 48 * SHK; sc.bottom = -48 * SHK; sc.near = 10; sc.far = 150 * SHK;
sun.position.multiplyScalar(SHK); sun.target.position.multiplyScalar(SHK);
scene.add(hemi, sun, sun.target);

// ===================== Materials (shared) =====================
const M = {};
function mat(name, color, extra) {
  M[name] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0 }, extra));
}
mat('core', COL.coreFloor); mat('court', COL.court); mat('bridge', COL.bridge); mat('roof', COL.roof);
mat('wall', COL.wall); mat('pillar', COL.pillar); mat('silk', COL.silk, { roughness: 0.7 });
mat('gold', COL.gold, { metalness: 0.6, roughness: 0.45 }); mat('bronze', COL.bronze, { metalness: 0.4, roughness: 0.6 });

mat('spawn', COL.spawn); mat('abyss', COL.abyss, { roughness: 1 }); mat('player', COL.player, { roughness: 0.6 });
mat('aim', COL.aim, { emissive: COL.aim, emissiveIntensity: 0.6 }); mat('blob', COL.blob, { roughness: 1 });
mat('terrace', COL.court); mat('stone', COL.stone); mat('broken', COL.broken, { roughness: 1 });
mat('eyes', COL.eyes, { emissive: COL.eyes, emissiveIntensity: 0.4 }); mat('ring', COL.ring, { emissive: COL.ring, emissiveIntensity: 1.2 });
mat('altarOn', COL.altarOn, { emissive: COL.altarOn, emissiveIntensity: 0.9 }); mat('altarOff', COL.altarOff, { roughness: 1 });
M.rail = M.wall;
const warnMat = new THREE.MeshStandardMaterial({ color: COL.court, emissive: COL.warn, emissiveIntensity: 0.5, roughness: 0.9 });
mat('dummy', COL.dummy, { roughness: 0.8 }); mat('hit', COL.hit, { emissive: COL.hit, emissiveIntensity: 1 });
mat('ind', COL.ind, { emissive: COL.ind, emissiveIntensity: 0.9 }); mat('fx', COL.fx, { emissive: COL.fx, emissiveIntensity: 1.2 });
// Fog of war: every world material is dimmed beyond the vision radius around the player (one shared shader variant).
const FOW = { uFowC: { value: new THREE.Vector3() }, uFowR: { value: CONFIG.VISION_R }, uFowDim: { value: CONFIG.FOW_DIM } };
function addFow(m) {
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uFowC = FOW.uFowC; sh.uniforms.uFowR = FOW.uFowR; sh.uniforms.uFowDim = FOW.uFowDim;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vFowPos;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvFowPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vFowPos;\nuniform vec3 uFowC;\nuniform float uFowR;\nuniform float uFowDim;')
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\ngl_FragColor.rgb *= mix(1.0, uFowDim, smoothstep(uFowR, uFowR + 3.0, distance(vFowPos.xz, uFowC.xz)));');
  };

function box(w, h, d, x, y, z) { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g; }
function cyl(r, h, x, y, z, seg) { const g = new THREE.CylinderGeometry(r, r, h, seg || 14); g.translate(x, y, z); return g; }
function mergeGeoms(list) {
  let nv = 0, ni = 0;
  for (const g of list) { nv += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
  const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  let vo = 0, io = 0;
  for (const g of list) {
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    if (g.index) { const a = g.index.array; for (let i = 0; i < a.length; i++) idx[io + i] = a[i] + vo; io += a.length; }
    else { for (let i = 0; i < c; i++) idx[io + i] = vo + i; io += c; }
    vo += c; g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

}
const SOLIDS = [];
function part(sec, m, g) { const p = SEC[sec].parts; (p[m] || (p[m] = [])).push(g); }

// Apply MAP_SCALE to every layout position once (props keep their size).
const K = CONFIG.MAP_SCALE;
for (const f of FLOORS) { f.x0 *= K; f.x1 *= K; f.z0 *= K; f.z1 *= K; f.s = SEC[f.sec]; f.active = true; }
for (const list of [PILLARS, CURTAINS, CAMPS, SPAWNS, LIONS, ALTARS]) for (const p of list) { p[0] *= K; p[1] *= K; }

// Floor surface height at x, z.
function surf(f, x, z) {
  if (!f.ramp) return f.y;

}
function inRect(f, x, z) { return x >= f.x0 && x <= f.x1 && z >= f.z0 && z <= f.z1; }
function topY(x, z) { let h = -1e9; for (const f of FLOORS) if (f.active && inRect(f, x, z)) h = Math.max(h, surf(f, x, z)); return h; }

// m = extra margin around each gap strip, metres.
function inBroken(x, z, m) { for (let i = 0; i < BROKEN.length; i++) { const b = BROKEN[i]; if (x >= b[0] - m && x <= b[1] + m && z >= b[2] - m && z <= b[3] + m) return true; } return false; }

// Floors: a box whose top follows the surface; solid floors reach down to the ground.
for (const f of FLOORS) {
  const w = f.x1 - f.x0, d = f.z1 - f.z0, g = new THREE.BoxGeometry(w, 1, d);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = f.x0 + p.getX(i) + w / 2, z = f.z0 + p.getZ(i) + d / 2, h = surf(f, x, z);

// Rails on every edge over the void, except broken-rail gaps (rubble stubs there instead).
const RAIL_SEG = 2;

}

    P.vy -= CONFIG.GRAVITY * dt; P.y += P.vy * dt;
    if (f && P.y <= fh) {
      P.y = fh; P.air = false; P.vy = 0;
      if (P.airFromY - fh >= CONFIG.DROP_MIN) hurt(CONFIG.DROP_DAMAGE);
    } else if (!f) {
      P.voidT += dt;
      if (P.voidT >= CONFIG.RESPAWN_S || P.y < CONFIG.VOID_Y) respawn('fell');
    }
  }
  if (f && !P.air && P.zone !== f.s) { P.zone = f.s; setText(el.hud, f.s.name); }
  updateHp();
  stepCombat(dt);
}
// Skills, delayed hits, effects, dummies and their vision.
function stepCombat(dt) {
  for (let i = 0; i < SK.length; i++) {
    const st = SK[i];
    if (st.cdT > 0) st.cdT = Math.max(0, st.cdT - dt);
    const c = Math.ceil(st.cdT);
    if (c !== st.shown) { st.shown = c; if (st.cdEl) { setText(st.cdEl, c > 0 ? String(c) : ''); setShow(st.cdEl, c > 0); } }
  }
  if (PEND.on) { PEND.t -= dt; if (PEND.t <= 0) { PEND.on = false; fxTele.visible = false; applySkill(PEND.slot, PEND.x, PEND.z, PEND.dx, PEND.dz); } }
  if (G.fxT > 0) { G.fxT -= dt; if (G.fxT <= 0) { fxLine.visible = false; fxRing.visible = false; } }
  const VR = CONFIG.VISION_R;
  for (let i = 0; i < DUMMY_LIST.length; i++) {
    const d = DUMMY_LIST[i];
    if (d.hp <= 0) { d.deadT -= dt; if (d.deadT <= 0) { d.hp = CONFIG.DUMMY_HP; d.bar.scale.x = 1; } }
    if (d.flashT > 0) { d.flashT -= dt; if (d.flashT <= 0) d.body.material = M.dummy; }
    const seen = d.s.state < 2 && Math.hypot(d.x - P.x, d.z - P.z) <= VR;
    d.seen = seen;
    const vis = seen && d.hp > 0;
    if (d.body.visible !== vis) { d.body.visible = vis; d.bar.visible = vis; }
  }
}
function updateHp() {
  const n = Math.ceil(P.hp);
  if (n !== P.hpShown) { P.hpShown = n; setText(el.hptext, T('hp', { n })); setBar(el.hpfill, n / CONFIG.MAX_HP); }
}
function hurt(n) {
  if (P.dead) return;
  P.hp -= n; P.noHealT = CONFIG.ALTAR.hitPauseS;
  if (P.hp <= 0) { P.hp = 0; P.dead = true; P.deadT = 0; P.kx = P.kz = 0; showNote('voice_died', 'rule_died'); }
}
function showNote(voiceKey, ruleKey) {
  if (G.bannerWave >= 0) return;
  setText(el.voice, T(voiceKey)); setText(el.rule, T(ruleKey)); setShow(el.banner, true); G.fellT = 2;
}
// PERFRAME-END

// ===================== Minimap (MOBA corner map; shows only what the player can see) =====================
const MINI = { x0: -78, z0: -82, w: 156, h: 132, px: 1, py: 1, W: 0, H: 0, base: document.createElement('canvas'), ctx: null, bctx: null };
function setupMini() {
  const W = TOUCH ? CONFIG.MINI_W_TOUCH : CONFIG.MINI_W, H = Math.round(W * MINI.h / MINI.w);
  el.mini.width = W; el.mini.height = H; MINI.base.width = W; MINI.base.height = H; MINI.W = W; MINI.H = H;
  MINI.px = W / MINI.w; MINI.py = H / MINI.h; MINI.ctx = el.mini.getContext('2d'); MINI.bctx = MINI.base.getContext('2d');
}
// Static layer: floors (high ground lighter, warned sections red, fallen ones gone), walls, dais, camps, lions. Redrawn only on change.
function drawMiniBase() {
  const c = MINI.bctx, px = MINI.px, py = MINI.py, X = (x) => (x - MINI.x0) * px, Z = (z) => (z - MINI.z0) * py;
  c.fillStyle = '#0c0a10'; c.fillRect(0, 0, MINI.W, MINI.H);
  for (const f of FLOORS) {
    if (f.s.state >= 2) continue;
    c.fillStyle = f.s.state === 1 ? '#b33a2a' : f.mat === 'core' ? '#5a4632' : f.mat === 'bridge' ? '#7a5636' : f.ramp ? '#86806f' : (f.y >= 4 ? '#aaa390' : '#66615a');
    c.fillRect(X(f.x0), Z(f.z0), (f.x1 - f.x0) * px, (f.z1 - f.z0) * py);
  }
  c.fillStyle = '#8a2420'; for (const [x0, x1, z0, z1] of WALLS) c.fillRect(X(x0), Z(z0), Math.max(1, (x1 - x0) * px), Math.max(1, (z1 - z0) * py));
  c.fillStyle = '#c9a040'; c.fillRect(X(-6), Z(DZ), 12 * px, 7 * py);
  c.fillStyle = '#ff8a2a'; for (const [x, z, s] of CAMPS) if (SEC[s].state < 2) c.fillRect(X(x) - 2, Z(z) - 2, 4, 4);
  c.fillStyle = '#cfcabd'; for (const [x, z, s] of LIONS) if (SEC[s].state < 2) c.fillRect(X(x) - 1.5, Z(z) - 1.5, 3, 3);
}
// PERFRAME-BEGIN
function drawMini() {
  if (G.miniDirty) { G.miniDirty = false; drawMiniBase(); }
  const c = MINI.ctx, px = MINI.px, py = MINI.py;
  c.drawImage(MINI.base, 0, 0);
  for (let i = 0; i < ALTAR_LIST.length; i++) {
    const a = ALTAR_LIST[i]; if (a.s.state >= 2) continue;
    c.fillStyle = a.charge > 0 ? '#5cff9a' : '#2a3a30'; c.beginPath(); c.arc((a.x - MINI.x0) * px, (a.z - MINI.z0) * py, 2.5, 0, 6.2832); c.fill();
  }
  c.fillStyle = '#ff2a10';
  for (let i = 0; i < HAZARDS.length; i++) {
    const h = HAZARDS[i]; if (h.state !== 1) continue;
    c.beginPath(); c.arc((h.x - MINI.x0) * px, (h.z - MINI.z0) * py, h.cfg.radius * px, 0, 6.2832); c.fill();
  }
  c.fillStyle = '#ff4040';
  for (let i = 0; i < DUMMY_LIST.length; i++) {
    const d = DUMMY_LIST[i]; if (!d.seen || d.hp <= 0) continue;
    c.beginPath(); c.arc((d.x - MINI.x0) * px, (d.z - MINI.z0) * py, 2.5, 0, 6.2832); c.fill();
  }
  const x = (P.x - MINI.x0) * px, z = (P.z - MINI.z0) * py;
  if (PATH.i < PATH.n) {
    c.strokeStyle = '#7fd0ff'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, z);
    for (let i = PATH.i; i < PATH.n; i++) c.lineTo((PATH.pts[i * 2] - MINI.x0) * px, (PATH.pts[i * 2 + 1] - MINI.z0) * py);
    c.stroke();
  }
  c.strokeStyle = 'rgba(127,208,255,0.55)'; c.lineWidth = 1; c.beginPath(); c.arc(x, z, CONFIG.VISION_R * px, 0, 6.2832); c.stroke();
  c.fillStyle = '#3a9bff'; c.beginPath(); c.arc(x, z, 3.5, 0, 6.2832); c.fill();
  c.strokeStyle = '#ffffff'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, z); c.lineTo(x + P.faceX * 7, z + P.faceZ * 7); c.stroke();
}
// PERFRAME-END

// Map test only: back to the centre courtyard with full health.
function respawn(kind) {
  if (kind === 'fell') showNote('voice_fell', 'rule_fell');
  P.dead = false; P.deadT = 0; P.air = false; P.vy = 0; P.voidT = 0; P.kx = P.kz = 0; P.hp = CONFIG.MAX_HP; P.noHealT = 0;
  P.x = P.px = CONFIG.RESPAWN_XZ[0] * K; P.z = P.pz = CONFIG.RESPAWN_XZ[1] * K;
  P.y = P.py = topY(P.x, P.z);
}

// New run: resets everything the run changes (time, waves, sections, floors, player, banner, shadows).
function reset() {
  G.time = 0; G.bannerWave = -1; G.fellT = 0; G.nextWave = -2;
  for (const w of WAVES) { w.state = 0; w.lastCount = -1; }
  for (const s of SECLIST) {
    s.state = 0; s.fallT = 0; s.group.position.y = 0; s.group.updateMatrix();
    for (let i = 0; i < s.floorMeshes.length; i++) s.floorMeshes[i].material = s.floorMats[i];
    if (!s.group.parent) scene.add(s.group);
  }
  for (const f of FLOORS) f.active = true;
  for (const h of HAZARDS) { h.state = 0; h.t = 0; h.ring.visible = false; }
  M.eyes.emissiveIntensity = 0.4;
  for (const a of ALTAR_LIST) { a.charge = CONFIG.ALTAR.charge; a.emptyT = 0; a.mesh.material = M.altarOn; }
  for (const d of DUMMY_LIST) { d.hp = CONFIG.DUMMY_HP; d.deadT = 0; d.flashT = 0; d.body.material = M.dummy; d.bar.scale.x = 1; }
  for (const st of SK) { st.cdT = 0; st.shown = -1; }
  ORD.attack = null; ORD.atkHeld = false; ORD.rightHeld = false; ORD.attackMove = false; cancelAim(); PATH.n = 0; PATH.i = 0;
  PEND.on = false; G.fxT = 0; fxLine.visible = fxRing.visible = fxTele.visible = false; G.miniDirty = true;
  P.faceX = 0; P.faceZ = -1; P.atkT = 0; P.stuckT = 0;
  const sp = SPAWNS[CONFIG.PLAYER_SPAWN];
  P.x = P.px = sp[0]; P.z = P.pz = sp[1]; P.y = P.py = topY(sp[0], sp[1]);
  P.vy = 0; P.air = false; P.voidT = 0; P.dead = false; P.deadT = 0; P.kx = P.kz = 0;
  P.hp = CONFIG.MAX_HP; P.hpShown = -1; P.noHealT = 0; P.zone = null;
  updateHp();
  setShow(el.banner, false);
  renderer.shadowMap.needsUpdate = true;
}

// ===================== View, tier, frame =====================
const tmpV = new THREE.Vector3();
const pitch = THREE.MathUtils.degToRad(CONFIG.CAM_PITCH_DEG);
const camOffY = Math.sin(pitch) * CONFIG.CAM_DIST, camOffZ = Math.cos(pitch) * CONFIG.CAM_DIST;
function toggleView() { setView(G.view === 'follow' ? 'overview' : 'follow'); }
function setView(v) {
  G.view = v;
  const farOv = CONFIG.FAR_OVERVIEW * K;
  camera.far = v === 'follow' ? CONFIG.FAR_FOLLOW : farOv;
  scene.fog.far = v === 'follow' ? CONFIG.FOG_FAR : farOv * 2;
  scene.fog.near = v === 'follow' ? CONFIG.FOG_NEAR : farOv;
  camera.updateProjectionMatrix();
  FOW.uFowR.value = v === 'follow' ? CONFIG.VISION_R : 1e5;
  setText(el.btnMap, T(v === 'follow' ? 'btn_map' : 'btn_follow'));
}
function applyTier(name) {
  tier = name; const t = CONFIG.TIER[name];
  renderer.setPixelRatio(Math.min(devicePixelRatio, t.pr));
  renderer.setSize(innerWidth, innerHeight);
  if (renderer.shadowMap.enabled !== t.shadows) { renderer.shadowMap.enabled = t.shadows; for (const k in M) M[k].needsUpdate = true; warnMat.needsUpdate = true; }
  sun.shadow.mapSize.set(t.shadowMap, t.shadowMap);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  renderer.shadowMap.needsUpdate = true;
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; if (G.paused) clearInput(); });
cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); G.ctxLost = true; });
cv.addEventListener('webglcontextrestored', () => { G.ctxLost = false; renderer.shadowMap.needsUpdate = true; });

let acc = 0, last = 0, slowT = 0, dbgT = 0, frameMs = 0, errShown = false;
// PERFRAME-BEGIN
function placeView(alpha) {
  const x = P.px + (P.x - P.px) * alpha, z = P.pz + (P.z - P.pz) * alpha, y = P.py + (P.y - P.py) * alpha;
  playerGroup.position.set(x, y, z);
  if (G.view === 'follow') { camera.position.set(x, y + camOffY, z + camOffZ); camera.lookAt(x, y, z); }
  else { camera.position.set(CONFIG.OVERVIEW_POS[0] * K, CONFIG.OVERVIEW_POS[1] * K, CONFIG.OVERVIEW_POS[2] * K); camera.lookAt(0, 0, -12 * K); }
  camera.updateMatrixWorld();
  playerGroup.rotation.y = Math.atan2(-P.faceX, -P.faceZ);
  FOW.uFowC.value.set(x, y, z);
  // Aim indicators: desktop aims at the cursor; phone aims by the drag direction and length.
  if (ORD.aiming >= 0) {
    const sk = CONFIG.SKILLS[ORD.aiming];
    if (ORD.src === 'key') {
      const hp = cursorGround();
      if (hp.ok) { const ax = hp.x - x, az = hp.z - z, l = Math.hypot(ax, az); if (l > 0.05) { ORD.dirX = ax / l; ORD.dirZ = az / l; } ORD.dist = Math.min(l, sk.range); }
    }
    const dist = sk.type === 'line' ? sk.range : ORD.dist;
    ORD.aimX = x + ORD.dirX * dist; ORD.aimZ = z + ORD.dirZ * dist;
    indRange.position.set(x, y + 0.05, z); indRange.scale.setScalar(sk.range); indRange.visible = true;
    if (sk.type === 'line') {
      indLine.position.set(x, y + 0.06, z); indLine.rotation.y = Math.atan2(-ORD.dirX, -ORD.dirZ); indLine.scale.set(sk.width, 1, sk.range);
      indLine.visible = true; indCircle.visible = false;
    } else {
      indCircle.position.set(ORD.aimX, topYUnder(ORD.aimX, ORD.aimZ, y + 1) + 0.07, ORD.aimZ); indCircle.scale.setScalar(sk.radius);
      indCircle.visible = true; indLine.visible = false;
    }
  }
  warnMat.emissiveIntensity = 0.35 + 0.35 * Math.sin(G.time * 10);
}
function frame(now) {
  requestAnimationFrame(frame);
  G.frames++;
  try {
    const realMs = last ? now - last : 16; last = now;
    if (G.paused || G.ctxLost) return;
    const dt = Math.min(realMs / 1000, CONFIG.MAX_DT);
    acc += dt;
    while (acc >= CONFIG.STEP) { step(CONFIG.STEP); acc -= CONFIG.STEP; }
    placeView(acc / CONFIG.STEP);
    if (ORD.rightHeld) { ORD.repathT -= dt; if (ORD.repathT <= 0) { ORD.repathT = CONFIG.REPATH_S; rightOrder(); } }
    G.miniT -= dt; if (G.miniT <= 0) { G.miniT = 1 / CONFIG.MINI_HZ; drawMini(); }
    renderer.render(scene, camera);
    renderer.shadowMap.needsUpdate = false;
    frameMs += (realMs - frameMs) * 0.1;
    if (!LOCK_TIER && tier !== 'low') {
      slowT = realMs > CONFIG.STEPDOWN_MS ? slowT + realMs / 1000 : Math.max(0, slowT - realMs / 1000);
      if (slowT > CONFIG.STEPDOWN_HOLD_S) { slowT = 0; applyTier('low'); }
    }
    if (DEBUG) {
      dbgT -= realMs;
      if (dbgT <= 0) {
        dbgT = 500; const r = renderer.info.render, m = renderer.info.memory;
        setText(el.dbg, 'ms ' + frameMs.toFixed(1) + ' | calls ' + r.calls + ' | tris ' + r.triangles + ' | geo ' + m.geometries + ' | prog ' + renderer.info.programs.length + ' | tier ' + tier);
      }
    }
  } catch (err) {
    if (!errShown) { errShown = true; setText(el.err, T('err_title') + '\n\n' + (err && err.stack || err)); setShow(el.err, true); }
  }
}
// PERFRAME-END

// ===================== Start: warm-up under the first frame =====================
setText(el.help, T(TOUCH ? 'help_touch' : 'help_desktop'));
if (TOUCH) document.body.classList.add('touch');
setShow(el.btnMap, DEBUG);
setupMini(); buildBar();
setShow(el.dbg, DEBUG);
applyTier(tier);
setView('follow');
reset();
const warm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), warnMat);
warm.receiveShadow = true; warm.castShadow = true; scene.add(warm);
for (const m of INDICATORS) m.visible = true;
placeView(1);
renderer.compile(scene, camera);
renderer.render(scene, camera);
for (const m of INDICATORS) m.visible = false;
scene.remove(warm); warm.geometry.dispose();
drawMini();
renderer.shadowMap.needsUpdate = true;

// Test hooks (read-mostly).
window.__game = {
  step(n) { for (let i = 0; i < n; i++) step(CONFIG.STEP); },
  setMove(x, z) { testMove.on = true; testMove.x = x; testMove.z = z; },
  clearMove() { testMove.on = false; testMove.x = testMove.z = 0; },
  teleport(x, z) { P.x = P.px = x; P.z = P.pz = z; P.y = P.py = topY(x, z); P.air = false; P.vy = 0; P.kx = P.kz = 0; P.dead = false; },
  damage(n) { hurt(n); }, knock(kx, kz) { P.kx = kx; P.kz = kz; }, setHp(n) { P.hp = n; },
  hazards: () => HAZARDS.map((h) => ({ kind: h.kind, x: h.x, z: h.z, y: h.y, state: h.state, ring: h.ring.visible })),
  altars: () => ALTAR_LIST.map((a) => ({ x: a.x, z: a.z, y: a.y, charge: a.charge, on: a.mesh.material === M.altarOn })),
  topY, broken: () => BROKEN.map((b) => b.slice()), K,
  floorIdx: (x, z, y) => FLOORS.indexOf(floorAt(x, z, y)), surfAt: (i, x, z) => surf(FLOORS[i], x, z),
  moveTo(x, z) { ORD.attack = null; return navSearch(P.x, P.z, P.y, x, z, topY(x, z)); },
  path: () => ({ n: PATH.n, i: PATH.i, pts: Array.from(PATH.pts.slice(0, PATH.n * 2)) }),
  attack(i) { ORD.attack = DUMMY_LIST[i]; PATH.n = 0; }, stop: stopOrders,
  cast(slot, x, z) { return castSkill(slot, x, z); }, autoCast, autoTargetIdx: (r) => DUMMY_LIST.indexOf(autoTarget(r)),
  dummies: () => DUMMY_LIST.map((d) => ({ x: d.x, z: d.z, hp: d.hp, seen: d.seen, visible: d.body.visible })),
  skills: () => SK.map((st) => st.cdT), pending: () => PEND.on,
  ground: (nx, ny) => { const h = screenToGround(nx, ny); return { ok: h.ok, x: h.x, y: h.y, z: h.z }; },
  project(x, y, z) { tmpV.set(x, y, z).project(camera); return [tmpV.x, tmpV.y]; },
  aimKey(slot, nx, ny) { ORD.nx = nx; ORD.ny = ny; startAim(slot, 'key'); placeView(1); return { aiming: ORD.aiming, ind: [indRange.visible, indLine.visible, indCircle.visible] }; },
  releaseKey() { releaseAim(); },
  fowCenter: () => FOW.uFowC.value.toArray(),
  miniPixel(x, z) { drawMini(); const d = MINI.ctx.getImageData(Math.round((x - MINI.x0) * MINI.px), Math.round((z - MINI.z0) * MINI.py), 1, 1).data; return [d[0], d[1], d[2]]; },
  miniSize: () => [el.mini.width, el.mini.height], ui: () => ({ bar: el.bar.children.length, btnMap: el.btnMap.style.display, touch: TOUCH }),
  state() {
    return { view: G.view, t: G.time, x: P.x, y: P.y, z: P.z, falling: P.air, dead: P.dead, hp: P.hp, zone: P.zone ? P.zone.id : null,
      waves: WAVES.map((w) => w.state), sec: Object.fromEntries(SECLIST.map((s) => [s.id, s.state])),
      inScene: Object.fromEntries(SECLIST.map((s) => [s.id, !!s.group.parent])), frames: G.frames, paused: G.paused, ctxLost: G.ctxLost, tier };
  },
  canStand, walkable: (x, z, y) => !!floorAt(x, z, y === undefined ? 99 : y),
  render(forceShadow) {
    if (forceShadow) renderer.shadowMap.needsUpdate = true;
    placeView(1); renderer.render(scene, camera); renderer.shadowMap.needsUpdate = false;
    return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length,
      geoms: renderer.info.memory.geometries, texs: renderer.info.memory.textures };
  },
  setView, reset,
  floors: () => FLOORS.map((f) => ({ sec: f.sec, x0: f.x0, x1: f.x1, z0: f.z0, z1: f.z1 })),
  config: CONFIG, text: TEXT, sections: SECTION_IDS, spawns: SPAWNS,
  canvasSize: () => [cv.width, cv.height],
  loseContext() { const x = renderer.getContext().getExtension('WEBGL_lose_context'); x.loseContext(); return x; },
};
window.__ready = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
