<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empress Decrees - box prototype (batch 8)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1620;color:#f3e6c8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;left:12px;top:10px;font:16px Georgia,serif;text-shadow:0 1px 3px #000;pointer-events:none}
#next{position:fixed;right:12px;top:10px;font:14px system-ui,sans-serif;text-align:right;text-shadow:0 1px 3px #000;pointer-events:none;max-width:45vw}
#banner{position:fixed;left:50%;top:13%;transform:translateX(-50%);text-align:center;pointer-events:none;display:none;max-width:92vw;text-shadow:0 2px 4px #000}
#banner .voice{font:italic 24px Georgia,serif;color:#ffd98a}
#banner .rule{font:15px system-ui,sans-serif;color:#fff;margin-top:6px}
#dbg{position:fixed;left:12px;bottom:10px;font:12px monospace;display:none;pointer-events:none;text-shadow:0 1px 2px #000}
#help{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);font:13px system-ui,sans-serif;opacity:.85;pointer-events:none;text-align:center;text-shadow:0 1px 2px #000}
#btnMap{position:fixed;right:12px;bottom:12px;min-width:64px;min-height:44px;font:15px system-ui,sans-serif;background:#3a2a3a;color:#fff;border:1px solid #b99;border-radius:8px}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #fff8;display:none;pointer-events:none}
#err{position:fixed;inset:0;background:#2a0b0b;color:#fff;padding:20px;display:none;font:14px monospace;white-space:pre-wrap;z-index:9}
#hp{position:fixed;left:12px;top:36px;width:180px;height:14px;background:#0008;border:1px solid #fff6;border-radius:3px;pointer-events:none}
#hpfill{height:100%;width:100%;background:#d23b3b;border-radius:2px}
#hptext{position:absolute;left:6px;top:-1px;font:12px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
#mini{position:fixed;right:10px;bottom:10px;border:2px solid #b99;border-radius:4px;background:#0c0a10}
body.touch #mini{right:auto;left:10px;top:10px;bottom:auto}
body.touch #hud{top:auto;left:auto;right:12px;top:40px}
body.touch #hp{left:auto;right:12px;top:62px}
body.touch #next{top:10px;right:12px}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px}
.sk{position:relative;width:52px;height:52px;border-radius:8px;background:#2a2030;border:2px solid #c9a040;color:#fff;font:bold 16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sk .cd{position:absolute;inset:0;background:#000a;border-radius:6px;display:none;align-items:center;justify-content:center;font:bold 18px system-ui}
.sk .lb{position:absolute;bottom:-15px;font:11px system-ui;color:#ddd;white-space:nowrap}
body.touch #bar{left:auto;right:18px;bottom:18px;transform:none;width:230px;height:200px;display:block}
body.touch .sk{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:auto;touch-action:none}
body.touch .sk.atk{width:88px;height:88px;right:0;bottom:0;font-size:15px}
body.touch .sk .lb{display:none}
#boss{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(46vw,420px);display:none;pointer-events:none;text-align:center;text-shadow:0 1px 2px #000}
#bossname{font:15px Georgia,serif;color:#ffd98a}
#bossbar{height:12px;background:#0008;border:1px solid #fff6;border-radius:3px;margin:3px 0}
#bossfill{height:100%;width:100%;background:#e0662a;border-radius:2px}
#bossskills{font:12px system-ui,sans-serif;color:#fff}
#status{position:fixed;left:12px;top:56px;font:bold 13px system-ui,sans-serif;color:#ffb0a0;text-shadow:0 1px 2px #000;pointer-events:none}
#btnHunt{position:fixed;left:12px;bottom:40px;min-width:120px;min-height:44px;font:15px system-ui,sans-serif;background:#5a1a1a;color:#fff;border:1px solid #f88;border-radius:8px;display:none}
body.touch #help{bottom:12px}
body.touch #btnHunt{left:160px;top:10px;bottom:auto}
body.touch #status{left:auto;right:12px;top:82px}
body.touch #banner{top:26%}
#cancel{position:fixed;right:20px;top:90px;width:90px;height:56px;border-radius:10px;background:#5a1a1a;color:#fff;font:15px system-ui;display:none;align-items:center;justify-content:center;border:2px solid #f88}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>

  const farOv = CONFIG.FAR_OVERVIEW * K;
  camera.far = v === 'follow' ? CONFIG.FAR_FOLLOW : farOv;
  scene.fog.far = v === 'follow' ? CONFIG.FOG_FAR : farOv * 2;
  scene.fog.near = v === 'follow' ? CONFIG.FOG_NEAR : farOv;
  camera.updateProjectionMatrix();
  FOW.uFowR.value = v === 'follow' ? G.visR : 1e5;
  setText(el.btnMap, T(v === 'follow' ? 'btn_map' : 'btn_follow'));
}
function applyTier(name) {
  tier = name; const t = CONFIG.TIER[name];
  renderer.setPixelRatio(Math.min(devicePixelRatio, t.pr));
  renderer.setSize(innerWidth, innerHeight);
  if (renderer.shadowMap.enabled !== t.shadows) { renderer.shadowMap.enabled = t.shadows; for (const k in M) M[k].needsUpdate = true; warnMat.needsUpdate = true; }
  sun.shadow.mapSize.set(t.shadowMap, t.shadowMap);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  renderer.shadowMap.needsUpdate = true;
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; if (G.paused) clearInput(); });
cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); G.ctxLost = true; });
cv.addEventListener('webglcontextrestored', () => { G.ctxLost = false; renderer.shadowMap.needsUpdate = true; });

let acc = 0, last = 0, slowT = 0, dbgT = 0, frameMs = 0, errShown = false;
// PERFRAME-BEGIN
function placeView(alpha) {
  const x = P.px + (P.x - P.px) * alpha, z = P.pz + (P.z - P.pz) * alpha, y = P.py + (P.y - P.py) * alpha;
  playerGroup.position.set(x, y, z);
  if (G.view === 'follow') { camera.position.set(x, y + camOffY, z + camOffZ); camera.lookAt(x, y, z); }
  else { camera.position.set(CONFIG.OVERVIEW_POS[0] * K, CONFIG.OVERVIEW_POS[1] * K, CONFIG.OVERVIEW_POS[2] * K); camera.lookAt(0, 0, -12 * K); }
  camera.updateMatrixWorld();
  playerGroup.rotation.y = Math.atan2(-P.faceX, -P.faceZ);
  FOW.uFowC.value.set(x, y, z);
  // Aim indicators: desktop aims at the cursor; phone aims by the drag direction and length.
  if (ORD.aiming >= 0) {
    const sk = CONFIG.SKILLS[ORD.aiming];
    if (ORD.src === 'key') {
      const hp = cursorGround();
      if (hp.ok) { const ax = hp.x - x, az = hp.z - z, l = Math.hypot(ax, az); if (l > 0.05) { ORD.dirX = ax / l; ORD.dirZ = az / l; } ORD.dist = Math.min(l, sk.range); }
    }
    const dist = sk.type === 'line' ? sk.range : ORD.dist;
    ORD.aimX = x + ORD.dirX * dist; ORD.aimZ = z + ORD.dirZ * dist;
    indRange.position.set(x, y + 0.05, z); indRange.scale.setScalar(sk.range); indRange.visible = true;
    if (sk.type === 'line') {
      indLine.position.set(x, y + 0.06, z); indLine.rotation.y = Math.atan2(-ORD.dirX, -ORD.dirZ); indLine.scale.set(sk.width, 1, sk.range);
      indLine.visible = true; indCircle.visible = false;
    } else {
      indCircle.position.set(ORD.aimX, topYUnder(ORD.aimX, ORD.aimZ, y + 1) + 0.07, ORD.aimZ); indCircle.scale.setScalar(sk.radius);
      indCircle.visible = true; indLine.visible = false;
    }
  }
  if (G.phase === 'royale') for (let i = 0; i < CUBS.length; i++) {
    const u = CUBS[i]; if (!u.alive) continue;
    u.group.position.set(u.px + (u.x - u.px) * alpha, u.y, u.pz + (u.z - u.pz) * alpha);
    u.body.rotation.y = Math.atan2(-u.fx, -u.fz);
  }
  if (G.phase === 'royale') for (let i = 0; i < NEUTRALS.length; i++) {
    const u = NEUTRALS[i]; if (!u.alive) continue;
    u.group.position.set(u.px + (u.x - u.px) * alpha, u.y, u.pz + (u.z - u.pz) * alpha);
    u.body.rotation.y = Math.atan2(-u.fx, -u.fz);
  }
  if (G.phase !== 'royale') for (let i = 0; i < ENEMIES.length; i++) {
    const u = ENEMIES[i]; if (!u.alive) continue;
    u.group.position.set(u.px + (u.x - u.px) * alpha, u.y, u.pz + (u.z - u.pz) * alpha);
    u.body.rotation.y = Math.atan2(-u.fx, -u.fz);
  }
  warnMat.emissiveIntensity = 0.35 + 0.35 * Math.sin(G.time * 10);
}
function frame(now) {
  requestAnimationFrame(frame);
  G.frames++;
  try {
    const realMs = last ? now - last : 16; last = now;
    if (G.paused || G.ctxLost) return;
    const dt = Math.min(realMs / 1000, CONFIG.MAX_DT);
    acc += dt;
    while (acc >= CONFIG.STEP) { step(CONFIG.STEP); acc -= CONFIG.STEP; }
    placeView(acc / CONFIG.STEP);
    if (ORD.rightHeld) { ORD.repathT -= dt; if (ORD.repathT <= 0) { ORD.repathT = CONFIG.REPATH_S; rightOrder(); } }
    G.miniT -= dt; if (G.miniT <= 0) { G.miniT = 1 / CONFIG.MINI_HZ; drawMini(); }
    renderer.render(scene, camera);
    renderer.shadowMap.needsUpdate = false;
    frameMs += (realMs - frameMs) * 0.1;
    if (!LOCK_TIER && tier !== 'low') {
      slowT = realMs > CONFIG.STEPDOWN_MS ? slowT + realMs / 1000 : Math.max(0, slowT - realMs / 1000);
      if (slowT > CONFIG.STEPDOWN_HOLD_S) { slowT = 0; applyTier('low'); }
    }
    if (DEBUG) {
      dbgT -= realMs;
      if (dbgT <= 0) {
        dbgT = 500; const r = renderer.info.render, m = renderer.info.memory;
        setText(el.dbg, 'ms ' + frameMs.toFixed(1) + ' | calls ' + r.calls + ' | tris ' + r.triangles + ' | geo ' + m.geometries + ' | prog ' + renderer.info.programs.length + ' | tier ' + tier);
      }
    }
  } catch (err) {
    if (!errShown) { errShown = true; setText(el.err, T('err_title') + '\n\n' + (err && err.stack || err)); setShow(el.err, true); }
  }
}
// PERFRAME-END

// ===================== Start: warm-up under the first frame =====================
setText(el.help, T(TOUCH ? 'help_touch' : 'help_desktop'));
if (TOUCH) document.body.classList.add('touch');
setShow(el.btnMap, DEBUG);
setupMini(); buildBar();
setShow(el.dbg, DEBUG);
applyTier(tier);
setView('follow');
reset();
const warm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), warnMat);
warm.receiveShadow = true; warm.castShadow = true; scene.add(warm);
for (const m of INDICATORS) m.visible = true;
// Hunt pieces sit at the player for this one draw so their buffers upload now, not at the wake.
const warmSeal = new THREE.Mesh(sealMesh.geometry, M.tellD); warmSeal.position.set(P.x, P.y, P.z - (CH.z1 - 0.5));
const warmHunt = [warmSeal];
for (const u of ENEMIES.concat(NEUTRALS)) {
  warmHunt.push(u.group, u.ring, u.line, u.plate); u.group.visible = u.ring.visible = u.line.visible = true;
  for (const o of [u.group, u.ring, u.line, u.plate]) o.position.set(P.x, P.y, P.z);
}
for (const o of warmHunt) scene.add(o);
for (const h of HAZARDS) h.ring.visible = true;
placeView(1);
renderer.compile(scene, camera);
renderer.render(scene, camera);
// One draw of the whole map so every section's buffers upload at load, not when first seen.
setView('overview'); placeView(1); renderer.render(scene, camera); setView('follow');
for (const h of HAZARDS) h.ring.visible = false;
for (const o of warmHunt) scene.remove(o);
for (const u of ENEMIES.concat(NEUTRALS)) hideTell(u);
for (const m of INDICATORS) m.visible = false;
scene.remove(warm); warm.geometry.dispose();
drawMini();
renderer.shadowMap.needsUpdate = true;

// Test hooks (read-mostly).
function tellsOf(list) {
  return list.filter((u) => u.alive && u.st === 1 && u.cur !== 'ult').map((u) => { const m = MOVES[u.cur], mesh = m.shape === 'line' ? u.line : u.ring;
    return { by: u.kind, move: u.cur, shape: m.shape, x: m.shape === 'line' ? u.x : u.tx, z: m.shape === 'line' ? u.z : u.tz, r: m.radius || 0, fx: u.fx, fz: u.fz, len: u.tl, w: m.width || 0,
      age: u.tellT, left: u.t, shown: mesh.visible, look: mesh.material === M.tellS ? 'S' : mesh.material === M.tellH ? 'H' : 'D' }; });
}
window.__game = {
  step(n) { for (let i = 0; i < n; i++) step(CONFIG.STEP); },
  setMove(x, z) { testMove.on = true; testMove.x = x; testMove.z = z; },
  clearMove() { testMove.on = false; testMove.x = testMove.z = 0; },
  teleport(x, z) { P.x = P.px = x; P.z = P.pz = z; P.y = P.py = topY(x, z); P.air = false; P.vy = 0; P.kx = P.kz = 0; P.dead = false; },
  damage(n) { hurtSuit(P, n, 'test', null); }, knock(kx, kz) { P.kx = kx; P.kz = kz; }, setHp(n) { P.hp = n; },
  hazards: () => HAZARDS.map((h) => ({ kind: h.kind, x: h.x, z: h.z, y: h.y, state: h.state, ring: h.ring.visible })),
  altars: () => ALTAR_LIST.map((a) => ({ x: a.x, z: a.z, y: a.y, charge: a.charge, on: a.mesh.material === M.altarOn })),
  topY, broken: () => BROKEN.map((b) => b.slice()), K,
  floorIdx: (x, z, y) => FLOORS.indexOf(floorAt(x, z, y)), surfAt: (i, x, z) => surf(FLOORS[i], x, z),
  moveTo(x, z) { ORD.attack = null; return navSearch(P.x, P.z, P.y, x, z, topY(x, z)); },
  path: () => ({ n: PATH.n, i: PATH.i, pts: Array.from(PATH.pts.slice(0, PATH.n * 2)) }),
  attack(i) { ORD.attack = DUMMY_LIST[i]; PATH.n = 0; }, stop: stopOrders,
  cast(slot, x, z) { return castSkill(slot, x, z); }, autoCast, autoTargetIdx: (r) => DUMMY_LIST.indexOf(autoTarget(r)),
  dummies: () => DUMMY_LIST.map((d) => ({ x: d.x, z: d.z, hp: d.hp, seen: d.seen, visible: d.body.visible })),
  skills: () => SK.map((st) => st.cdT), pending: () => PEND.on,
  ground: (nx, ny) => { const h = screenToGround(nx, ny); return { ok: h.ok, x: h.x, y: h.y, z: h.z }; },
  project(x, y, z) { tmpV.set(x, y, z).project(camera); return [tmpV.x, tmpV.y]; },
  aimKey(slot, nx, ny) { ORD.nx = nx; ORD.ny = ny; startAim(slot, 'key'); placeView(1); return { aiming: ORD.aiming, ind: [indRange.visible, indLine.visible, indCircle.visible] }; },
  releaseKey() { releaseAim(); },
  fowCenter: () => FOW.uFowC.value.toArray(),
  miniPixel(x, z) { drawMini(); const d = MINI.ctx.getImageData(Math.round((x - MINI.x0) * MINI.px), Math.round((z - MINI.z0) * MINI.py), 1, 1).data; return [d[0], d[1], d[2]]; },
  miniSize: () => [el.mini.width, el.mini.height], ui: () => ({ bar: el.bar.children.length, btnMap: el.btnMap.style.display, touch: TOUCH }),
  state() {
    return { view: G.view, t: G.time, x: P.x, y: P.y, z: P.z, falling: P.air, dead: P.dead, hp: P.hp, zone: P.zone ? P.zone.id : null,
      waves: WAVES.map((w) => w.state), sec: Object.fromEntries(SECLIST.map((s) => [s.id, s.state])),
      inScene: Object.fromEntries(SECLIST.map((s) => [s.id, !!s.group.parent])), frames: G.frames, paused: G.paused, ctxLost: G.ctxLost, tier };
  },
  canStand, walkable: (x, z, y) => !!floorAt(x, z, y === undefined ? 99 : y),
  render(forceShadow) {
    if (forceShadow) renderer.shadowMap.needsUpdate = true;
    placeView(1); renderer.render(scene, camera); renderer.shadowMap.needsUpdate = false;
    return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length,
      geoms: renderer.info.memory.geometries, texs: renderer.info.memory.textures };
  },
  setView, reset, startHunt, huntButton,
  hunt() {
    return { phase: G.phase, t: G.huntT, plates: G.plates, hits: G.hits, minTell: G.minTell, hitDmg: G.hitDmg, bleedDmg: G.bleedDmg, gateZ: GATE_Z,
      statue: !!statue.parent, statueSolid: !statueSolid.off, seal: !!sealMesh.parent,
      p: { x: P.x, z: P.z, hp: P.hp, stun: P.stunT, slow: P.slowT, slowK: P.slowK, bleed: P.bleedN },
      units: ENEMIES.map((u) => ({ kind: u.kind, x: u.x, z: u.z, hp: u.hp, alive: u.alive, seen: u.seen, st: u.st, cur: u.cur, skills: u.skills.slice(), inScene: !!u.group.parent,
        frenzy: u.frenzyT, plate: !!u.plate.parent, standOk: !u.alive || u.st === 2 || unitOk(u, u.x, u.z) })),
      tells: tellsOf(ENEMIES) };
  },
  cubs() {
    return { wave: G.kWave, warned: G.kWarned, taken: G.platesTaken, hits: G.hits, minTell: G.minTell, plates: P.pk.map((k, i) => ({ kind: k, t: P.pt[i] })), ultCd: SK[2].cdT, status: el.status.textContent,
      voice: el.voice.textContent, rule: el.rule.textContent, banner: el.banner.style.display,
      list: CUBS.map((u) => ({ kind: u.kind, x: u.x, z: u.z, y: u.y, hp: u.hp, max: u.maxHp, alive: u.alive, seen: u.seen, hot: u.hot, home: u.home, st: u.st, cur: u.cur, camp: u.camp, cx: u.cx, cz: u.cz,
        inScene: !!u.group.parent, tellIn: !!u.ring.parent, plate: !!u.plate.parent, bleed: u.bleedT, standOk: !u.alive || u.st === 2 || unitOk(u, u.x, u.z) })),
      tells: tellsOf(CUBS) };
  },
  neutrals() {
    return { next: G.nT.slice(), t: G.time, boons: G.boons, seed: G.seed, visR: G.visR, fow: FOW.uFowR.value, bT: P.bT.slice(), bV: P.bV.slice(), ultCd: SK[2].cdT, status: el.status.textContent,
      voice: el.voice.textContent, rule: el.rule.textContent, fusing: CUBS.filter((u) => u.fuseOn).length, fusePlates: CUBS.filter((u) => !!u.plate.parent).length,
      list: NEUTRALS.map((u) => ({ kind: u.kind, x: u.x, z: u.z, y: u.y, hp: u.hp, max: u.maxHp, alive: u.alive, seen: u.seen, boon: u.nb, amt: u.nv, spot: u.spot, inScene: !!u.group.parent,
        sec: u.spot >= 0 ? SEC[SPOTS[u.spot][2]].state : -1, standOk: !u.alive || unitOk(u, u.x, u.z) })) };
  },
  hitNeutral(i, n) { hitEnemy(NEUTRALS[i], n, P); }, forceNeutral(i, spot, boon, amt) { const u = NEUTRALS[i]; if (u.alive) loseNeutral(u); spawnNeutral(u, i, spot, boon, amt); },
  attackNeutral(i) { const u = NEUTRALS[i]; if (u.seen && u.hp > 0) { ORD.attack = u; PATH.n = 0; return true; } return false; },
  drawBag(name) { return draw(BAGS[name]); }, setSeed(n) { G.seedFixed = n; }, spots: SPOTS,
  hitCub(i, n) { hitEnemy(CUBS[i], n, P); }, placeCub(i, x, z) { const u = CUBS[i]; u.x = u.px = x; u.z = u.pz = z; u.y = topY(x, z); }, cubCd(i, k, v) { CUBS[i].cd[k] = v; },
  attackCub(i) { const u = CUBS[i]; if (u.seen && u.hp > 0) { ORD.attack = u; PATH.n = 0; return true; } return false; },
  givePlate(kind) { const s = P.pt[0] <= 0 ? 0 : 1; P.pk[s] = kind; P.pt[s] = CONFIG.PLATE.buffS; }, camps: CAMPS,
  huntUi: () => ({ boss: el.boss.style.display, bossText: el.bossskills.textContent, btn: el.btnHunt.style.display, btnText: el.btnHunt.textContent,
    voice: el.voice.textContent, rule: el.rule.textContent, status: el.status.textContent, banner: el.banner.style.display }),
  attackUnit(i) { const u = ENEMIES[i]; if (u.seen && u.hp > 0) { ORD.attack = u; PATH.n = 0; return true; } return false; },
  hitUnit(i, n) { hitEnemy(ENEMIES[i], n, P); }, placeUnit(i, x, z) { const u = ENEMIES[i]; u.x = u.px = x; u.z = u.pz = z; },
  unitCd(i, k, v) { ENEMIES[i].cd[k] = v; }, moves: MOVE_KEYS,
  floors: () => FLOORS.map((f) => ({ sec: f.sec, x0: f.x0, x1: f.x1, z0: f.z0, z1: f.z1 })),
  config: CONFIG, text: TEXT, sections: SECTION_IDS, spawns: SPAWNS,
  canvasSize: () => [cv.width, cv.height],
  loseContext() { const x = renderer.getContext().getExtension('WEBGL_lose_context'); x.loseContext(); return x; },
};
window.__ready = true;
requestAnimationFrame(frame);
</script>
