<!doctype html>
<!-- Review viewer for the apex Tiger Demon and its cubs (W4, art tool, not shipped). Game camera (FOV 50, pitch 40), the game's two
     lights, the approved hall floor; a 0.9 x 2.05 x 0.9 m player box for scale.
     ?model=tiger|stalker|howler  &view=turn (&yaw=deg) | play (fight framing 10.5 m: tiger + both cubs + player) | statue (play framing,
     dormant tiger + player) | lods (LOD0, LOD1, LOD2) | row (nine school variants)  &state=awake|dormant  &school=0-8
     &clip=name &t=seconds (default: dormant pose asleep, idle awake)  &mode=tex|sil  -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#120d16;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { apexMaterials } from './apex_mat.js';
const Q = new URLSearchParams(location.search), MODEL = Q.get('model') || 'tiger', VIEW = Q.get('view') || 'turn', MODE = Q.get('mode') || 'tex';
const STATE = Q.get('state') || 'awake', SCHOOL = Q.get('school') === null ? null : +Q.get('school'), T = +(Q.get('t') || 0);
const CLIP = Q.get('clip') || (STATE === 'dormant' ? 'dormant' : 'idle');
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = MODE !== 'sil'; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(MODE === 'sil' ? 0xffffff : 0x120d16);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.3, 200);
scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x3a2a22, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.2); sun.position.set(-30, 60, 25); sun.target.position.set(0, 0, -12); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 10, far: 150 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun, sun.target);
const tl = new THREE.TextureLoader();
const tex = (f, rep) => { const t = tl.load(f); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; if (rep) t.repeat.set(rep, rep); else t.flipY = false; return t; };
if (MODE === 'tex') { const fl = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: tex('../../assets/tex/hall_floor.png', 10), roughness: 0.9 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl); }
const sil = new THREE.MeshBasicMaterial({ color: 0x000000 });
const lodOf = (n) => { const m = /_lod(\d)/.exec(n); return m ? +m[1] : 0; };
const loader = new GLTFLoader(), load = (m) => new Promise((ok, no) => loader.load(`../../assets/models/apex/${m}.glb`, ok, undefined, no));
let pending = 0;
async function place(model, { x = 0, z = 0, yaw = 0, state = STATE, school = SCHOOL, clip = CLIP, t = T, lod = 0 } = {}) {
  pending++;
  const g = await load(model), root = g.scene, mats = apexMaterials(THREE, tex, state, school);
  root.traverse((o) => { if (o.isMesh) { o.material = MODE === 'sil' ? sil : (mats[o.material.name] || mats.apexBronze); o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  root.traverse((o) => { if (o.isMesh) o.visible = lodOf(o.name) === lod; });
  const name = model === 'tiger' && clip === 'idle' && state === 'dormant' ? 'dormant' : clip;
  const a = g.animations.find((c) => c.name === name) || g.animations.find((c) => c.name === (model === 'tiger' ? 'idle' : 'idle'));
  if (a) { const mix = new THREE.AnimationMixer(root); mix.clipAction(a).play(); mix.setTime(Math.min(t, a.duration - 1e-3)); }
  root.position.set(x, 0, z); root.rotation.y = yaw * Math.PI / 180; scene.add(root); pending--;
  return root;
}
const player = (x, z) => { const p = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.05, 0.9), MODE === 'sil' ? sil : new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.6 })); p.position.set(x, 1.025, z); p.castShadow = true; scene.add(p); };
const BIG = MODEL === 'tiger';
let look = new THREE.Vector3(0, BIG ? 1.05 : 0.55, 0), dist = BIG ? 7.6 : 3.4, pitch = 15, yaw = +(Q.get('yaw') || 30);
if (VIEW === 'turn') await place(MODEL);
else if (VIEW === 'lods') { const s = BIG ? 3.2 : 1.6; for (let i = 0; i < 3; i++) await place(MODEL, { x: (i - 1) * s * 1.0, lod: i, yaw: 90 }); dist = BIG ? 11 : 5; yaw = 0; }
else if (VIEW === 'row') { const s = BIG ? 3.0 : 1.5; for (let i = 0; i < 9; i++) await place(MODEL, { x: ((i % 3) - 1) * s, z: (Math.floor(i / 3) - 1) * s * 1.9, school: i, yaw: 60 }); dist = BIG ? 19 : 8; pitch = 35; yaw = 0; look.set(0, 0.6, 0); }
else if (VIEW === 'play') { await place('tiger', { yaw: 20 }); await place('stalker', { x: -3.6, z: 2.4, yaw: 35 }); await place('howler', { x: 3.4, z: 2.2, yaw: -30 }); player(0.6, 4.2); dist = 10.5; pitch = 40; yaw = 0; look.set(0, 1.0, 1.2); }
else if (VIEW === 'statue') { await place('tiger', { state: 'dormant', clip: 'dormant' }); player(2.4, 2.6); dist = 10.5; pitch = 40; yaw = 0; look.set(0, 1.0, 0.6); }
const p2 = pitch * Math.PI / 180, y2 = yaw * Math.PI / 180;
cam.position.set(look.x + Math.sin(y2) * Math.cos(p2) * dist, look.y + Math.sin(p2) * dist, look.z + Math.cos(y2) * Math.cos(p2) * dist); cam.lookAt(look);
setTimeout(() => { r.render(scene, cam); window.__ready = true; }, 1500);
</script></body></html>
