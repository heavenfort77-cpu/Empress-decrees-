<!doctype html>
<!-- Review viewer for the nine school suits (art tool, not shipped). Same camera FOV (50) and pitch (40), the same two lights and the
     approved hall floor as the game (index.html: hemi 1.1, sun 2.2 from (-30, 60, 25)); a player-size box beside the suit for scale.
     ?id=fa (one suit) | ids=fa,ru,... (lineup, 1.7 m apart)
     &view=play (fight framing 10.5 m, 110 px/m) | wide (22 m, 52 px/m) | turn (close turntable, &yaw=deg) | lods (LOD0, LOD1, LOD2)
     &mode=tex | shade | flat | sil   &clip=attack|idle &t=seconds (omit = rest pose)
     &view=strip&ts=0,0.05,... (SUITANIM contact strip: one cell per time, side camera near the floor, &dist= m, &move=m/s carries the suit
     forward by move x t with the camera following, so a planted foot stays on the same floor tile) &floorline=y (a thin red line at y)
     &pitch=deg overrides the camera pitch (strip at play size: pitch=40&dist=10.5, 1080 px high = 110 px/m)
     &mode=clothid: each suit's cloth flat in an ID colour (hue 40 deg x lineup index), everything else black, no floor (colour masks)
     &tintas=za:fa: za's cloth tint set to fa's after loading (colour-gate mutation)
     &mode=matid (SUITS fa r5): fa's armour atlas drawn flat with its region ID sheet (mask red, black lacquer green, rest blue), everything
       else black, no floor: masks for the mask-vs-helm contrast measure. &look=y: camera target height (head close-ups). Suit id fa_old loads
       assets/models/suits/fa_old.glb (the round-4 fa, copied there by the runner job only) for old/new comparisons.
     fa r5 materials faA / faM / faC use their own atlases (assets/tex/suit_fa_armour|metal|cloth.png) with normal maps (*_n.png).
     &rim=1: a pale view-facing rim (lead white, viewer-only demonstration of an outline option for the owner; not in the GLB, no game code)
     glTF UVs: sheets load with flipY false. Cloth materials keep the GLB colour (school tint) over the neutral cloth sheet. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#120d16;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'play', MODE = Q.get('mode') || 'tex', T = Q.get('t'), CLIP = Q.get('clip') || 'attack';
const IDS = (Q.get('ids') || Q.get('id') || 'fa').split(','), RIM = Q.get('rim') === '1';
const TS = (Q.get('ts') || '').split(',').filter((x) => x !== '').map(Number), MOVE = +(Q.get('move') || 0);
const W = VIEW === 'strip' ? Math.round(innerWidth / Math.max(TS.length, 1)) : innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: MODE !== 'sil' && MODE !== 'clothid' && MODE !== 'matid' }); r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = MODE === 'tex' || MODE === 'shade'; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(MODE === 'sil' ? 0xffffff : (MODE === 'clothid' || MODE === 'matid') ? 0x000000 : 0x120d16);
const clothMat = {};
const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 200);
scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x3a2a22, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.2); sun.position.set(-30, 60, 25); sun.target.position.set(0, 0, -12); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 10, far: 150 }); sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const tl = new THREE.TextureLoader();
const tex = (f, rep, flip = true) => { const t = tl.load(f); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; t.flipY = flip; if (rep) t.repeat.set(rep, rep); return t; };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: tex('../../assets/tex/hall_floor.png', 7), roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; if (MODE === 'tex' || MODE === 'shade') scene.add(floor);
const SHEET = { sLam: ['suit_lamellar', 0x2a2524, 0.0, 0.5], sBronze: ['suit_bronze', 0x8a6a3c, 0.5, 0.45], sCloth: ['suit_cloth', 0xe6e2da, 0.0, 0.85],
  faA: ['suit_fa_armour', 0xece6d6, 0.0, 0.42, 1], faM: ['suit_fa_metal', 0xd4b25a, 0.45, 0.35, 1], faC: ['suit_fa_cloth', 0xe5e1ca, 0.0, 0.85, 1] };
const cache = {};
function mat(m) {
  const key = m.name + MODE + RIM; if (cache[key]) return cache[key];
  const base = m.name.startsWith('sCloth') ? 'sCloth' : m.name; const [file, flat, metal, rough, nrm] = SHEET[base] || SHEET.sLam;
  const tint = base === 'sCloth' ? m.color.clone() : new THREE.Color(1, 1, 1);
  let out;
  if (MODE === 'sil') out = new THREE.MeshBasicMaterial({ color: 0x000000 });
  else if (MODE === 'matid') out = base === 'faA' ? new THREE.MeshBasicMaterial({ map: tex(`../../assets/tex/${file}_id.png`, 0, false) }) : new THREE.MeshBasicMaterial({ color: 0x000000 });
  else if (MODE === 'clothid') out = new THREE.MeshBasicMaterial({ color: base === 'sCloth' ? new THREE.Color().setHSL((IDS.indexOf(m.name.slice(7)) * 40) / 360, 1, 0.5, THREE.SRGBColorSpace) : 0x000000 });
  else if (MODE === 'flat') out = new THREE.MeshBasicMaterial({ color: base === 'sCloth' ? tint : new THREE.Color(flat) });
  else if (MODE === 'shade') out = new THREE.MeshStandardMaterial({ color: base === 'sCloth' ? tint : new THREE.Color(flat), metalness: metal, roughness: rough });
  else out = new THREE.MeshStandardMaterial({ map: tex(`../../assets/tex/${file}.png`, 0, false), color: tint, metalness: metal, roughness: rough });
  if (nrm && MODE === 'tex') { const n = tex(`../../assets/tex/${file}_n.png`, 0, false); n.colorSpace = THREE.NoColorSpace; out.normalMap = n; out.normalScale.set(1, -1); }   // as GLTFLoader does for glTF (flipY false, derivative tangents)
  if (RIM && out.isMeshStandardMaterial) out.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', '#include <opaque_fragment>\n  { float f = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition))); gl_FragColor.rgb += vec3(0.89, 0.87, 0.82) * smoothstep(0.55, 0.95, f) * 0.9; }');
  };
  if (base === 'sCloth') clothMat[m.name.slice(7)] = out;
  return (cache[key] = out);
}
const loader = new GLTFLoader(); let pending = 0; const mixers = [];
function place(id, x, lodShow) {
  pending++;
  loader.load(`../../assets/models/suits/${id}.glb`, (g) => {
    const root = g.scene; root.position.x = x;
    root.traverse((o) => { if (o.isMesh) { o.material = mat(o.material); o.castShadow = o.receiveShadow = true; o.frustumCulled = true;
      const m = /_lod(\d)$/.exec(o.name); if (m) o.visible = +m[1] === lodShow; } });
    scene.add(root);
    if (T !== null || VIEW === 'strip') { const mix = new THREE.AnimationMixer(root), clip = g.animations.find((a) => a.name === CLIP); if (clip) { const ac = mix.clipAction(clip); if (CLIP !== 'run' && CLIP !== 'idle') { ac.setLoop(THREE.LoopOnce); ac.clampWhenFinished = true; } ac.play(); mix.setTime(+(T || 0)); mixers.push([mix, root]); } }
    if (--pending === 0) shoot();
  });
}
if (VIEW === 'lods') { place(IDS[0], -1.8, 0); place(IDS[0], 0, 1); place(IDS[0], 1.8, 2); }
else IDS.forEach((id, i) => place(id, (i - (IDS.length - 1) / 2) * 1.7, 0));
const player = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.05, 0.9), new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.6 })); player.position.set(1.6, 1.025, -1.2); player.castShadow = true;
if ((VIEW === 'play' || VIEW === 'wide') && IDS.length === 1 && (MODE === 'tex' || MODE === 'shade')) scene.add(player);
const pitch = (Q.get('pitch') ? +Q.get('pitch') : VIEW === 'turn' ? 15 : VIEW === 'strip' ? 6 : 40) * Math.PI / 180, look = new THREE.Vector3(0, Q.get('look') ? +Q.get('look') : VIEW === 'turn' ? 1.05 : VIEW === 'strip' ? 0.8 : 1.0, 0);
const dist = Q.get('dist') ? +Q.get('dist') : VIEW === 'play' ? 10.5 : VIEW === 'wide' ? 22 : VIEW === 'lods' ? 6 : VIEW === 'strip' ? 5.2 : 3.3, yaw = (+(Q.get('yaw') || 0)) * Math.PI / 180;
if (Q.get('floorline') !== null) { const y = +Q.get('floorline'); const ln = new THREE.Mesh(new THREE.BoxGeometry(40, 0.006, 0.006), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
  ln.position.set(0, y, 0); ln.rotation.y = yaw + Math.PI / 2; scene.add(ln); }
cam.position.set(look.x + Math.sin(yaw) * Math.cos(pitch) * dist, look.y + Math.sin(pitch) * dist, look.z + Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(look);
function shoot() {
  if (Q.get('tintas')) { const [a, b] = Q.get('tintas').split(':'); if (clothMat[a] && clothMat[b]) clothMat[a].color.copy(clothMat[b].color); }
  if (VIEW !== 'strip') { setTimeout(() => { r.render(scene, cam); window.__ready = true; }, 900); return; }
  // contact strip: render each time into one row; the camera keeps its offset to the (moving) suit
  setTimeout(() => {
    const out = document.createElement('canvas'); out.width = W * TS.length; out.height = H; const cx = out.getContext('2d'); const cam0 = cam.position.clone();
    TS.forEach((t, i) => {
      for (const [mix, root] of mixers) { mix.setTime(t); root.position.z = MOVE * t; }
      cam.position.set(cam0.x, cam0.y, cam0.z + MOVE * t); cam.lookAt(look.x, look.y, MOVE * t);
      r.render(scene, cam); cx.drawImage(r.domElement, i * W, 0);
      cx.fillStyle = '#fff'; cx.font = '14px sans-serif'; cx.fillText(`${CLIP} ${t.toFixed(3)} s`, i * W + 6, 18); cx.fillStyle = '#555'; cx.fillRect(i * W, 0, 1, H);
    });
    r.domElement.remove(); document.body.appendChild(out); window.__ready = true;
  }, 900);
}
</script></body></html>
