<!-- Room scene sheets for the W2 palace pieces (art tool, not shipped): assembles each room type from the B pieces (assets/models/arch)
     and the A textures (assets/tex) at the game camera (FOV 50, pitch 40), the game's two lights (hemi 1.1, sun 2.2 from (-30, 60, 25)),
     shadows on, tier medium (pixel ratio 1). Repeats are InstancedMesh (one call per piece material), single props THREE.LOD.
     ?room=hall|court|corridor|garden|bridge|core  &view=wide (room fit) | play (fight framing, 10.5 m) | up (looking up, core ceiling)
     &burnt=1 (A18 material swap)  &locked=1 (door bars shown; default open rooms show bars hidden)
     ?piece=<name>&yaw=deg : one piece alone, 3/4 view.  window.__stats = { calls, tris, callsMain, trisMain, lights } after the render.
     FIXB 25 Nov (owner 02:1x-02:2x): bronze pieces use the brass sheet (bronze_trim_brass) only; garden ponds = light pond_water with a pale
     1 m margin (vertex colours); core floor = approved 丹 floor plus the star-map inlay decal (star_inlay, alpha test, cells turned per 4 m;
     &inlay=0 hides it); &tell=1 adds the game's hazard rings (0xff2a10, emissive 1.2) on the core floor; &wall=<png name> / &mural=<png name>
     swap the plaster textures (side-by-side candidates); &mask=tag,tag renders white for the tagged meshes (pond, ground, floor, inlay, tell,
     throne, racks, wall, mural, plants) and black for the rest, unlit, for on-screen measurements. -->
