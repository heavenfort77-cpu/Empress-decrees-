<!doctype html>
<!-- Review viewer for the PIECES round (art tool, not shipped): Kaymuse, the crab and the wanderer, the plate pickup, the leader crown, the
     墨 wall and the decree mark. The game's camera (FOV 50, pitch 40, CAM_DIST 14), its two lights and the hall floor texture.
     ?scene=one&model=ID      one piece at the origin. &view=turn (close turntable: &yaw= &pitch= &dist= &ly= look height) | cam (the game camera)
                              &lod=0|1|2|all &clip=idle|move &t=seconds
     ?scene=lineup            every floor piece at play size beside in-game characters at the same scale: 鼎, 墨 suit (leader crown over it),
                              crab, wanderer, 卒 guard, plate, 法 suit (decree mark over it), the 墨 wall behind. &clip= &t= pose the creatures.
     ?scene=throne&view=play|approach|wide|close   Kaymuse on throne_dais.glb with a suit and a guard at the dais foot (&yaw= &pitch= close)
     &mode=tex | sil (black on white, no floor) | mask (&mask=ID: that piece unlit white, the rest black: on-screen measurement;
            &matmask=NAME narrows the mask to one material of that piece, e.g. palBronze; ID ding = the 鼎 beside them)
     Outline: the crab and the wanderer are characters, so they are drawn with the game's renderer outline, simulated here with the
            game's own shader (src/chars.js outlineMaterial on branch ci-run-int: back faces pushed out along the normal by 2 device
            px, colour 0x0b0908); &outline=0 turns it off. Static props and Kaymuse get none.
     &floor=tex (the current hall floor) | light (the lighter floor candidate of branch ci-art-colour, a copy at art/pieces/floor_candidate.png:
            the contrast gate is judged on it; the throne's 丹 top takes it too) | calm (flat #7a2a1c)
     &dir=path of the pieces GLBs (default ../../assets/models/pieces/). Materials: art/tools/pieces_mats.json. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#120d16;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search), SCENE = Q.get('scene') || 'one', MODE = Q.get('mode') || 'tex', VIEW = Q.get('view') || (SCENE === 'one' ? 'turn' : 'play');
const MASK = Q.get('mask'), DIR = Q.get('dir') || '../../assets/models/pieces/', LOD = Q.get('lod') || '0', CLIP = Q.get('clip'), T = +(Q.get('t') || 0);
const W = innerWidth, H = innerHeight, LIT = MODE === 'tex';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = LIT; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(MODE === 'sil' ? 0xffffff : MODE === 'mask' ? 0x000000 : 0x120d16);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 300);
// game lights (index.html: hemi 1.1, sun 2.2 from (-30, 60, 25) toward (0, 0, -12))
scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x3a2a22, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.2); sun.position.set(-30, 60, 25); sun.target.position.set(0, 0, -12); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 10, far: 150 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun, sun.target);
const TL = new THREE.TextureLoader(), TEX = {};
const FLOOR = Q.get('floor') || 'tex';
const tex = (f, flip = false, rep = 0) => { const k = f + flip + rep; if (TEX[k]) return TEX[k]; const t = TL.load(f === 'hall_floor' && FLOOR === 'light' ? '../pieces/floor_candidate.png' : `../../assets/tex/${f}.png`); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; t.flipY = flip; if (rep) t.repeat.set(rep, rep); return (TEX[k] = t); };
const BLACK = new THREE.MeshBasicMaterial({ color: 0x000000 }), WHITE = new THREE.MeshBasicMaterial({ color: 0xffffff });
if (MODE !== 'sil') {
  const fm = MODE === 'mask' ? BLACK : FLOOR === 'calm' ? new THREE.MeshStandardMaterial({ color: 0x7a2a1c, roughness: 0.9 }) : new THREE.MeshStandardMaterial({ map: tex('hall_floor', true, 10), roughness: 0.9 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), fm); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
}
const TABLE = await (await fetch('../tools/pieces_mats.json')).json();
// in-game reference art: suit sheets (suits.html), guard sheets (fodder.html), palace props (beast.html, arch.html)
const REFS = { sLam: { tex: 'suit_lamellar', roughness: 0.5 }, sBronze: { tex: 'suit_bronze', metalness: 0.5, roughness: 0.45 }, sCloth: { tex: 'suit_cloth', roughness: 0.85, tint: true },
  gdBronze: { tex: 'bronze_trim_brass', metalness: 0.4, roughness: 0.6 }, gdLacquer: { tex: 'fodder_trim', metalness: 0.05, roughness: 0.8 }, treadBelt: { tex: 'tread_belt', metalness: 0.4, roughness: 0.6 },
  palStone: { tex: 'stone_paving', roughness: 0.85 }, palFloor: { tex: 'hall_floor', roughness: 0.85 }, palLacquer: { tex: 'timber', color: '#5a4f4a', roughness: 0.85 }, palPillar: { tex: 'pillar', roughness: 0.85 },
  palAccent: { color: '#a8321e', roughness: 0.85 }, palAsh: { color: '#4a443e', roughness: 1 }, palCoal: { color: '#3a1a0e', roughness: 1 } };
const MADE = {};
function mat(m) {
  const base = m.name.startsWith('sCloth') ? 'sCloth' : m.name, key = m.name; if (MADE[key]) return MADE[key];
  const d = TABLE[base] || REFS[base] || { color: '#808080', roughness: 0.8 };
  const o = { metalness: d.metalness || 0, roughness: d.roughness === undefined ? 0.8 : d.roughness };
  if (d.tex) o.map = tex(d.tex);
  o.color = d.tint ? m.color.clone() : new THREE.Color(d.color || '#ffffff');
  return (MADE[key] = new THREE.MeshStandardMaterial(o));
}
// The game's renderer outline (src/chars.js CHR.outline: { px: 2, color: 0x0b0908 }), same vertex code: back faces pushed out along the
// (skinned) normal in clip space by uOPx device pixels. Only for the pieces the game treats as characters.
const OUTLINED = new Set(['crab', 'wanderer']), OUTLINE_ON = Q.get('outline') !== '0', MATMASK = Q.get('matmask');
const OUT = { px: { value: 2 }, res: { value: new THREE.Vector2(W, H) } }, OUTMATS = {};
function outlineMaterial(color) {
  if (OUTMATS[color]) return OUTMATS[color];
  const m = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uOPx = OUT.px; sh.uniforms.uORes = OUT.res;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uOPx;\nuniform vec2 uORes;')
      .replace('#include <project_vertex>', `#include <project_vertex>
#ifdef USE_SKINNING
vec3 chrN = normalize( normalMatrix * objectNormal );
#else
vec3 chrN = normalize( normalMatrix * normal );
#endif
vec2 chrD = ( projectionMatrix * vec4( chrN, 0.0 ) ).xy;
gl_Position.xy += normalize( chrD + vec2( 1e-6 ) ) * uOPx * 2.0 / uORes * gl_Position.w;`);
  };
  m.customProgramCacheKey = () => 'chrOutline1' + color;
  return (OUTMATS[color] = m);
}
const loader = new GLTFLoader(), mixers = [];
// place one GLB: id = mask id; lod = which LOD shows ('all' keeps the exported side-by-side places); clip + t pose it
function place(url, id, x, y, z, { lod = '0', clip = null, t = 0, yaw = 0 } = {}) {
  return new Promise((res, rej) => loader.load(url, (g) => {
    const root = g.scene; root.position.set(x, y, z); root.rotation.y = yaw;
    // LOD nodes are named <id>_lod0/1/2; a mesh with several materials loads as a group of that name with child meshes (run 45554531198:
    // the filter looked at the child names and hid everything). Top-level objects without a LOD name (state objects) are hidden.
    if (lod !== 'all') root.traverse((o) => {
      const l = /_lod([012])$/.exec(o.name);
      if (l) { if (l[1] !== lod) o.visible = false; else if (l[1] !== '0') o.position.x = 0; }
      else if (o.isMesh && !/_lod[012]$/.test(o.parent ? o.parent.name : '')) o.visible = false;
    });
    const lined = [];
    root.traverse((o) => {
      if (!o.isMesh) return;
      o.frustumCulled = false; o.castShadow = o.receiveShadow = LIT; const m0 = o.material.name;
      o.material = MODE === 'sil' ? BLACK : MODE === 'mask' ? (id === MASK && (!MATMASK || m0 === MATMASK) ? WHITE : BLACK) : mat(o.material);
      if (OUTLINED.has(id) && OUTLINE_ON && o.visible && !MATMASK) lined.push(o);
    });
    for (const o of lined) {  // one extra back-face draw per mesh, as the game does for its characters
      let vis = true; for (let p = o; p; p = p.parent) vis = vis && p.visible; if (!vis) continue;
      const om = outlineMaterial(MODE === 'mask' ? (id === MASK ? 0xffffff : 0x000000) : MODE === 'sil' ? 0x000000 : 0x0b0908);
      const ol = o.isSkinnedMesh ? new THREE.SkinnedMesh(o.geometry, om) : new THREE.Mesh(o.geometry, om);
      if (o.isSkinnedMesh) ol.bind(o.skeleton, o.bindMatrix);
      ol.position.copy(o.position); ol.quaternion.copy(o.quaternion); ol.scale.copy(o.scale); ol.frustumCulled = false; ol.name = o.name + '_ol'; o.parent.add(ol);
    }
    scene.add(root);
    if (clip) { const c = g.animations.find((a) => a.name === clip); if (c) { const mix = new THREE.AnimationMixer(root); mix.clipAction(c).play(); mix.setTime(t); mixers.push(mix); } else window.__noclip = (window.__noclip || '') + id + ':' + clip + ' '; }
    res(g);
  }, undefined, rej));
}
const P = (id) => `${DIR}${id}.glb`, M = (p) => `../../assets/models/${p}.glb`;
function aim(look, dist, pitchDeg, yawDeg = 0) {
  const p = pitchDeg * Math.PI / 180, y = yawDeg * Math.PI / 180;
  cam.position.set(look.x + Math.sin(y) * Math.cos(p) * dist, look.y + Math.sin(p) * dist, look.z + Math.cos(y) * Math.cos(p) * dist); cam.lookAt(look);
}
const jobs = [];
if (SCENE === 'one') {
  const id = Q.get('model') || 'crab';
  jobs.push(place(P(id), id, 0, 0, 0, { lod: LOD, clip: CLIP, t: T }));
  if (VIEW === 'cam') aim(new THREE.Vector3(0, 1, 0), 14, 40, +(Q.get('yaw') || 0));
  else aim(new THREE.Vector3(+(Q.get('lx') || 0), +(Q.get('ly') || 0.8), 0), +(Q.get('dist') || 4), +(Q.get('pitch') || 15), +(Q.get('yaw') || 30));
} else if (SCENE === 'lineup') {
  jobs.push(place(M('ding'), 'ding', -6.2, 0, 0), place(M('suits/mo'), 'ref', -4.4, 0, 0), place(P('leader_crown'), 'leader_crown', -4.4, 2.95, 0),
    place(P('crab'), 'crab', -2.3, 0, 0.3, { clip: CLIP, t: T }), place(P('wanderer'), 'wanderer', 0, 0, 0.3, { clip: CLIP, t: T }), place(M('guard/zu'), 'ref', 1.9, 0, 0),
    place(P('plate'), 'plate', 3.5, 0, 0.6), place(M('suits/fa'), 'ref', 5.2, 0, 0), place(P('decree_mark'), 'decree_mark', 5.2, 3.5, 0), place(P('mo_wall'), 'mo_wall', 0.5, 0, -3.4));
  aim(new THREE.Vector3(-0.5, 1.0, -0.5), VIEW === 'wide' ? 22 : 14, 40);
} else {
  jobs.push(place(M('arch/throne_dais'), 'ref', 0, 0, 0), place(M('suits/mo'), 'ref', 3.2, 0, 4.2), place(M('guard/zu'), 'ref', -3.2, 0, 4.2));
  jobs.push(place(P('kaymuse'), 'kaymuse', 0, 2.16, -0.84, { lod: LOD, clip: CLIP, t: T }));
  if (VIEW === 'close') aim(new THREE.Vector3(0, +(Q.get('ly') || 3.05), -0.84), +(Q.get('dist') || 5.2), +(Q.get('pitch') || 10), +(Q.get('yaw') || 0));
  else if (VIEW === 'approach') aim(new THREE.Vector3(0, 1, 7), 14, 40);
  else aim(new THREE.Vector3(0, 2.2, 0.5), VIEW === 'wide' ? 24 : 14, 40);
}
try { await Promise.all(jobs); } catch (e) { window.__err = String(e && e.message || e); }
setTimeout(() => { scene.updateMatrixWorld(true); r.render(scene, cam); window.__ready = true; }, 900);
</script></body></html>
