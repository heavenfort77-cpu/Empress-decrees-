<!doctype html>
<!-- Review viewer for the twelve bronze giants (C8; art tool, not shipped). Adapted from beast.html: same camera FOV 50 and pitch 40, the same
     two lights and the approved hall floor; a player-size box and the game's current box giant (index.html gGeo) beside it for scale.
     ?g=0-11 (giant)  &state=dormant | awake  &clip=dormant|wake|carry|walk|slam|sweep|hit|fall &t=seconds (default: dormant pose when dormant,
     carry when awake)  &view=play (fight framing, 0.75 x 14 m) | wide (22 m) | turn (&yaw=deg &pitch=deg) | lods (LOD0-2 side by side)
     &lod=0|1|2 (force one LOD)  &mode=tex | shade | flat | sil  &sheet=brass (default for awake) | default (bronze_trim.png)
     &nobox=1 hides the player and the box giant (tiles for the lineup sheets).
     Dormant: palBronze uses bronze_trim_patina.png, palTin pale verdigris. Awake: brass sheet, palTin high-tin bronze #D8CDA8. The patina flakes
     (giant_flakes) show only in the wake clip. glTF UVs: the trim sheet loads with flipY false. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#120d16;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../lib/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'play', MODE = Q.get('mode') || 'tex';
const GI = +(Q.get('g') || 0), STATE = Q.get('state') || 'awake', SHEET = Q.get('sheet') || 'brass', NOBOX = Q.get('nobox') === '1';
const CLIP = Q.get('clip') || (STATE === 'dormant' ? 'dormant' : 'carry'), T = +(Q.get('t') || 0), FORCE_LOD = Q.get('lod');
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = MODE !== 'sil' && MODE !== 'flat'; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(MODE === 'sil' ? 0xffffff : 0x120d16);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 200);
scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x3a2a22, 1.1));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.2); sun.position.set(-30, 60, 25); sun.target.position.set(0, 0, -12); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 10, far: 150 }); sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const tl = new THREE.TextureLoader();
const tex = (f, rep) => { const t = tl.load(f); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; if (rep) t.repeat.set(rep, rep); return t; };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: tex('../../assets/tex/hall_floor.png', 7), roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; if (MODE === 'tex' || MODE === 'shade') scene.add(floor);
const sheet = (name) => { const t = tex(`../../assets/tex/${name}.png`); t.flipY = false; return t; };
const DORM = STATE === 'dormant';
const MATS = {
  tex: { palBronze: () => new THREE.MeshStandardMaterial({ map: sheet(DORM ? 'bronze_trim_patina' : SHEET === 'default' ? 'bronze_trim' : 'bronze_trim_brass'), metalness: DORM ? 0.15 : 0.4, roughness: DORM ? 0.8 : 0.6 }),
    palTin: () => DORM ? new THREE.MeshStandardMaterial({ color: 0x7c9c88, metalness: 0.15, roughness: 0.75 }) : new THREE.MeshStandardMaterial({ color: 0xd8cda8, metalness: 0.6, roughness: 0.35 }),
    palPatina: () => new THREE.MeshStandardMaterial({ map: sheet('bronze_trim_patina'), metalness: 0.15, roughness: 0.8 }) },
  shade: { palBronze: () => new THREE.MeshStandardMaterial({ color: 0x9a7a48, metalness: 0.4, roughness: 0.6 }), palTin: () => new THREE.MeshStandardMaterial({ color: 0xd8cda8, metalness: 0.6, roughness: 0.35 }), palPatina: () => new THREE.MeshStandardMaterial({ color: 0x4f7a62, roughness: 0.8 }) },
  flat: { palBronze: () => new THREE.MeshBasicMaterial({ color: 0x9a7a48 }), palTin: () => new THREE.MeshBasicMaterial({ color: 0xd8cda8 }), palPatina: () => new THREE.MeshBasicMaterial({ color: 0x4f7a62 }) },
  sil: { palBronze: () => new THREE.MeshBasicMaterial({ color: 0 }), palTin: () => new THREE.MeshBasicMaterial({ color: 0 }), palPatina: () => new THREE.MeshBasicMaterial({ color: 0 }) },
};
const made = {}; const matFor = (n) => made[n] || (made[n] = (MATS[MODE][n] || MATS[MODE].palBronze)());
// the game's box giant (index.html gGeo: legs, body, head, arms) for scale
function boxGiant(x) {
  const m = new THREE.MeshStandardMaterial({ color: 0x9a968c, roughness: 0.9 }), g = new THREE.Group();
  for (const [w, h, d, bx, by] of [[0.7, 2, 0.8, -0.5, 1], [0.7, 2, 0.8, 0.5, 1], [2.2, 2, 1.2, 0, 3], [0.9, 0.9, 0.9, 0, 4.45], [0.6, 2, 0.6, -1.45, 3], [0.6, 2, 0.6, 1.45, 3]]) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x + bx, by, 0); o.castShadow = o.receiveShadow = true; g.add(o);
  }
  return g;
}
const player = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.05, 0.9), new THREE.MeshStandardMaterial({ color: 0x3a7bd5, roughness: 0.6 })); player.position.set(3.2, 1.025, 3.2); player.castShadow = true;
const gname = 'g' + String(GI).padStart(2, '0');
new GLTFLoader().load('../../assets/models/giants/giants.glb', (gl) => {
  const root = gl.scene;
  root.traverse((o) => { if (o.isMesh) { o.material = matFor(o.material.name); o.castShadow = true; o.receiveShadow = true; } });
  // which meshes show: the shared body and this giant's parts, at one LOD (lods view: three copies would need three rigs; LOD0-2 are shot one by one)
  const lod = FORCE_LOD !== null ? +FORCE_LOD : 0;
  root.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    const n = (o.parent && o.parent.type === 'Group' && /^giant_/.test(o.parent.name)) ? o.parent.name : o.name;
    let show = false;
    if (n.startsWith('giant_flakes')) show = CLIP === 'wake';
    else { const m = /^giant_(body|g\d\d)_lod(\d)/.exec(n); if (m) show = (m[1] === 'body' || m[1] === gname) && +m[2] === lod; }
    o.visible = show;
  });
  scene.add(root);
  const mix = new THREE.AnimationMixer(root), clip = gl.animations.find((a) => a.name === CLIP);
  if (clip) { mix.clipAction(clip).play(); mix.setTime(Math.min(T, clip.duration - 1e-4)); }
  // culling stays on: skinned bounds recomputed in the posed state (fall, slam move the body far from the bind pose)
  root.updateMatrixWorld(true); root.traverse((o) => { if (o.isSkinnedMesh && o.computeBoundingSphere) o.computeBoundingSphere(); });
  if ((VIEW === 'play' || VIEW === 'wide') && !NOBOX) { scene.add(player); if (MODE === 'tex' || MODE === 'shade') scene.add(boxGiant(-5.5)); }
  const pitch = 40 * Math.PI / 180, look = new THREE.Vector3(VIEW === 'play' || VIEW === 'wide' ? -0.4 : 0, 2.2, 0.6);
  let dist = VIEW === 'play' ? 10.5 : VIEW === 'wide' ? 22 : (+(Q.get('dist') || 8)), yaw = (+(Q.get('yaw') || (VIEW === 'turn' ? 30 : 0))) * Math.PI / 180;
  if (VIEW === 'play' && NOBOX) look.x = 0;
  if (VIEW === 'turn') look.set(0, 2.5, 0.1);
  const p2 = VIEW === 'turn' ? (+(Q.get('pitch') || 12)) * Math.PI / 180 : pitch;
  cam.position.set(look.x + Math.sin(yaw) * Math.cos(p2) * dist, look.y + Math.sin(p2) * dist, look.z + Math.cos(yaw) * Math.cos(p2) * dist); cam.lookAt(look);
  const info = { tris: 0, calls: 0 };
  const go = () => { r.render(scene, cam); info.tris = r.info.render.triangles; info.calls = r.info.render.calls; window.__info = info; window.__ready = true; };
  setTimeout(go, 900);
}, undefined, (e) => { document.title = 'ERR ' + e; window.__ready = true; });
</script></body></html>
