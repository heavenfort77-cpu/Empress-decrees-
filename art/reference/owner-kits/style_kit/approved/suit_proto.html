<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>

</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div><canvas id="mini" width="64" height="64"></canvas>
<div class="pad"><button style="left:51px;top:0" data-d="0,-1">▲</button><button style="left:0;top:51px" data-d="-1,0">◀</button><button style="left:102px;top:51px" data-d="1,0">▶</button><button style="left:51px;top:102px" data-d="0,1">▼</button></div>
<div class="act"><button id="bA" style="right:0;top:51px">ATK</button><button id="bD" style="right:56px;top:102px">DASH</button><button id="bS" style="right:56px;top:0">SKL</button></div>
<div id="menu"><div>Pick a suit (box prototype)</div><div id="picks"></div><div style="font-size:12px;max-width:320px;text-align:center">Arrows/WASD move, J attack, K dash, L skill. 20 suits, storm closes in about 10 min.</div></div>
<div id="over"></div>
<script>
//@@LOGIC
const CONFIG = {
  N: 64, SUITS: 20, VISION: 5, SPAWN_GAP: 16, FLEE_HP: 0.5, EARLY_PEACE: 200, AG_SCALE: 0.7, HP_SCALE: 2, DECIDE: 8, HUNT_YM: 25, MJ_KILL: [0.25, 1.2],   // 冥将 grows by kills: +0.25x per kill, up to +1.2x MOVE_BASE: 0.4,          // seconds per tile at speed 2.5 (speed = 2.5 -> 0.4 s)
  BUSH_CLUSTERS: 40, BUSH_MIN: 5, BUSH_MAX: 14, RESOURCES: 90,
  RES_USE: 20, RES_REGROW: 90, BUSH_REGROW: 60, WRECK_STORM: 10,
  GROW_BUSH: 1.5, GROW_RES: 2.0, RES_HEAL: 0.02, RES_BURST: 0.15, REGEN: 0.005, REGEN_DELAY: 5, KILL_HEAL: 0.25,
  STORM: [[150,60,52],[90,50,40],[80,45,28],[70,40,18],[60,35,10],[45,30,4],[30,20,0]],   // 805 s total   // wait, shrink, side after
  STORM_DPS: [0.01,0.015,0.02,0.03,0.05,0.08,0.12],
  DASH_TILES: 3, DASH_CD: 8, MJ_DASH: [4, 3], ATK_PERIOD: 1.0,
  // hp, atk, speed(tiles/s), range, growth cap, cap time, aggression, colour, letter
  F: {
    tianbing:{hp:100,atk:10,spd:2.5,rg:1,cap:2.5,capT:420,ag:0.6,col:"#4fa96a",ch:"兵"},
    yuanmo:  {hp:70, atk:6, spd:2.0,rg:1,cap:4,  capT:600,ag:0.5,col:"#d1773a",ch:"猿"},
    wushi:   {hp:130,atk:8, spd:3.2,rg:3,cap:2.2,capT:420,ag:0.5,col:"#b8343c",ch:"巫"},
    mojiang: {hp:160,atk:0, spd:1.5,rg:0,cap:3,  capT:600,ag:0.2,col:"#5fa0a8",ch:"墨"},
    jianxian:{hp:70, atk:18,spd:2.5,rg:2,cap:2.0,capT:300,ag:0.8,col:"#d4e4f6",ch:"剑"},
    mingjiang:{hp:70,atk:14,spd:3.3,rg:1,cap:1.4,capT:150,ag:0.9,col:"#8a7ab0",ch:"冥"},
    tianlong:{hp:100,atk:8, spd:2.5,rg:3,cap:2.2,capT:420,ag:0.5,col:"#2f6fa8",ch:"龙"},
    gushi:   {hp:100,atk:5, spd:2.3,rg:0,cap:3,  capT:600,ag:0.3,col:"#b88d62",ch:"蛊"},
  },
  YM_STAGE2: 180, YM_STAGE3: 420, OVERDRIVE: [1.5,8,40], STUN:[8,1.5,12], CLOAK:[6,25,0], CHANNEL: 6, ARRAY:[1.5,10],
  TURRET:{atk:8,rg:3,max:4,hpShare:0.7,start:2,packT:2}, DECAY:{r:2,pct:0.02,pctLate:0.04,max:5,slow:0.3}, FOLLOWER:{share:0.7,max:3},
};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function createGame(opts){
  const C=CONFIG,N=C.N,rnd=mulberry(opts.seed||1),facs=Object.keys(C.F);
  const G={t:0,phase:0,phaseT:0,zone:{x0:0,y0:0,side:N},zoneFrom:null,zoneTo:null,
    fx:[],tiles:new Uint8Array(N*N),tileT:new Float32Array(N*N),wreck:new Map(),suits:[],turrets:[],decays:[],log:[],over:false,winner:null};
  const T={EMPTY:0,BUSH:1,RES:2,BUSH_DOWN:3,RES_DOWN:4};
  const idx=(x,y)=>y*N+x, inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
  // map: bush clusters >=5, resources exposed
  for(let k=0;k<C.BUSH_CLUSTERS;k++){const n=C.BUSH_MIN+Math.floor(rnd()*(C.BUSH_MAX-C.BUSH_MIN+1));let x=Math.floor(rnd()*N),y=Math.floor(rnd()*N);const cells=[[x,y]];
    while(cells.length<n){const [cx,cy]=cells[Math.floor(rnd()*cells.length)];const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rnd()*4)];const nx=cx+d[0],ny=cy+d[1];if(inb(nx,ny)&&!cells.some(c=>c[0]==nx&&c[1]==ny))cells.push([nx,ny])}
    cells.forEach(([a,b])=>G.tiles[idx(a,b)]=T.BUSH)}
  for(let k=0;k<C.RESOURCES;k++){const x=Math.floor(rnd()*N),y=Math.floor(rnd()*N);if(G.tiles[idx(x,y)]==T.EMPTY)G.tiles[idx(x,y)]=T.RES}
  // suits
  function mk(f,i,isPlayer){const F=C.F[f];let x,y;do{x=Math.floor(rnd()*N);y=Math.floor(rnd()*N)}while(G.suits.some(s=>Math.abs(s.x-x)+Math.abs(s.y-y)<C.SPAWN_GAP));
    return {id:i,f,F,x,y,hp:F.hp*C.HP_SCALE,maxhp:F.hp*C.HP_SCALE,clock:0,mult:1,alive:true,isPlayer:!!isPlayer,moveT:0,atkT:0,dashT:0,sklT:0,noDmgT:0,resT:0,
      stage:1,od:0,stun:0,cloak:0,chan:0,units:f=="mojiang"?C.TURRET.start:0,packT:0,follow:[],owner:null,dir:[0,1],aiT:rnd()*2,aiGoal:null,kills:0}}
  for(let i=0;i<(opts.suits||C.SUITS);i++){const f=opts.factions?opts.factions[i]:(i==0&&opts.player)?opts.player:facs[Math.floor(rnd()*facs.length)];G.suits.push(mk(f,i,i==0&&opts.player))}
  G.player=opts.player?G.suits[0]:null;
  const alive=()=>G.suits.filter(s=>s.alive);
  const inZone=(x,y)=>x>=G.zone.x0&&y>=G.zone.y0&&x<G.zone.x0+G.zone.side&&y<G.zone.y0+G.zone.side;
  const dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
  const inBush=s=>G.tiles[idx(s.x,s.y)]==T.BUSH;
  function stats(s){const m=s.mult;return {hp:s.F.hp*m,atk:s.F.atk*m*(s.od>0?C.OVERDRIVE[0]:1)*(s.f=="tianlong"?1+1.25*Math.min(1,s.chan/C.CHANNEL):1),
    spd:s.F.spd*(s.od>0?C.OVERDRIVE[0]:1)*(s.slow?1-C.DECAY.slow:1),rg:s.f=="yuanmo"?s.stage:(s.f=="tianlong"&&inBush(s)?8:s.F.rg)}}
  function canSee(a,b){if(!b.alive)return false;const d=dist(a,b);if(b.cloak>0&&d>C.CLOAK[2])return false;
    if(inBush(b)&&!(inBush(a)&&d<=1)&&!G.decays.some(z=>z.owner===a&&Math.max(Math.abs(z.x-b.x),Math.abs(z.y-b.y))<=C.DECAY.r)&&!b.revealT)return false;return d<=(a.f=="tianlong"&&inBush(a)?8:C.VISION)}   // 天龙 in a bush sees as far as it shoots (prototype assumption, to confirm)
  function damage(tgt,amt,src){if(!tgt.alive)return;tgt.hp-=amt;tgt.noDmgT=0;if(tgt.hp<=0){tgt.hp=0;tgt.alive=false;G.wreck.set(idx(tgt.x,tgt.y),{f:tgt.f,mult:tgt.mult,F:tgt.F,t:0,used:0});
    if(src){src.kills++;if(src.f=="mingjiang"){src.dashT=0;src.sklT=0}if(src.f=="mingjiang")src.killBonus=(src.killBonus||0)+C.MJ_KILL[0];src.hp=Math.min(src.maxhp,src.hp+C.KILL_HEAL*src.maxhp)}G.log.push([G.t|0,tgt.f,src?src.f:"storm"]);
    tgt.follow.forEach(fl=>fl.alive=false)}}
  function tryMove(s,dx,dy){if(s.moveT>0||s.stun>0)return false;const nx=s.x+dx,ny=s.y+dy;if(!inb(nx,ny))return false;
    if(G.suits.some(o=>o.alive&&o!==s&&o.x==nx&&o.y==ny)||G.turrets.some(o=>o.x==nx&&o.y==ny))return false;
    s.x=nx;s.y=ny;s.dir=[dx,dy];s.moveT=C.MOVE_BASE*2.5/stats(s).spd;if(s.chan>0)s.chan=0;
    const w=G.wreck.get(idx(nx,ny));if(w&&s.f=="mojiang"){s.units+=3;G.wreck.delete(idx(nx,ny))}return true}
  function attack(s,tgt){const st=stats(s);if(s.atkT>0||st.atk<=0||!tgt)return;s.atkT=C.ATK_PERIOD;let a=st.atk;if(s.f=="mingjiang"){if(!canSee(tgt,s))a*=2;if(s.cloak>0)s.cloak=0}   // 冥将: any hit the target cannot see coming is doubled (cloak, bush, decay-blind)
    if(inBush(s)&&s.f=="tianlong")s.revealT=1;G.fx.push({x0:s.x,y0:s.y,x1:tgt.x,y1:tgt.y,t:0.18});damage(tgt,a,s)}
  function dash(s){if(s.dashT>0||s.f=="mojiang")return;const mj=s.f=="mingjiang";s.dashT=mj?C.MJ_DASH[1]:C.DASH_CD;for(let k=0;k<(mj?C.MJ_DASH[0]:C.DASH_TILES);k++){const nx=s.x+s.dir[0],ny=s.y+s.dir[1];if(!inb(nx,ny)||G.suits.some(o=>o.alive&&o!==s&&o.x==nx&&o.y==ny))break;s.x=nx;s.y=ny}}
  function skill(s,tgt){if(s.sklT>0)return;const st=stats(s);
    switch(s.f){
      case "tianbing":s.od=C.OVERDRIVE[1];s.sklT=C.OVERDRIVE[2];break;
      case "wushi":{const w=[...G.wreck.entries()].find(([k,w])=>Math.abs(k%N-s.x)<=1&&Math.abs(Math.floor(k/N)-s.y)<=1);
        if(w&&s.follow.filter(f=>f.alive).length<C.FOLLOWER.max){const [k,wr]=w;const fl=mk(wr.f,900+s.id*10+s.follow.length,false);fl.x=k%N;fl.y=Math.floor(k/N);fl.mult=wr.mult*C.FOLLOWER.share;fl.maxhp=fl.hp=wr.F.hp*fl.mult*C.HP_SCALE;fl.owner=s;fl.F={...wr.F,ag:1};G.suits.push(fl);s.follow.push(fl);G.wreck.delete(k);s.sklT=2}
        else if(tgt&&dist(s,tgt)<=C.STUN[0]/C.STUN[0]*3){if(!(tgt.guard>0))tgt.stun=C.STUN[1];damage(tgt,C.STUN[0]*s.mult,s);s.sklT=C.STUN[2]}break}
      case "mojiang":{const t=G.turrets.find(t=>t.owner===s&&dist(s,t)<=1);if(t){s.packT+=1;if(s.packT>=C.TURRET.packT){G.turrets.splice(G.turrets.indexOf(t),1);s.units++;s.packT=0}s.sklT=1;break}
        if(s.units>=1&&G.turrets.filter(t=>t.owner===s).length<C.TURRET.max){const nx=s.x+s.dir[0],ny=s.y+s.dir[1];if(inb(nx,ny)&&!G.suits.some(o=>o.alive&&o.x==nx&&o.y==ny)){s.units--;G.turrets.push({owner:s,x:nx,y:ny,hp:s.maxhp*C.TURRET.hpShare,atkT:0,mult:s.mult});s.sklT=1}}break}
      case "jianxian":s.guard=1;alive().forEach(o=>{if(o!==s&&o.owner!==s&&dist(s,o)<=2&&canSee(s,o))damage(o,st.atk*C.ARRAY[0],s)});s.sklT=C.ARRAY[1];break;
      case "mingjiang":s.cloak=C.CLOAK[0];s.sklT=C.CLOAK[1];break;
      case "tianlong":s.chan=Math.min(C.CHANNEL,s.chan+1);s.sklT=0.5;break;
      case "gushi":if(G.decays.filter(z=>z.owner===s).length>=C.DECAY.max){const i=G.decays.findIndex(z=>z.owner===s);G.decays.splice(i,1)}G.decays.push({owner:s,x:s.x,y:s.y});s.sklT=3;break;
      case "yuanmo":dash(s);break;
    }}
  // ---- bot AI: plays like a player. threat check, kiting, skill timing per faction, bushes to heal, storm margin ----
  function power(o){const st=stats(o);return o.hp*Math.max(st.atk*(o.f=="mingjiang"&&(o.cloak>0||o.sklT<=0)?1.8:1),o.f=="mojiang"?C.TURRET.atk*o.mult:1)}
  function stepAway(s,from){const dx=-Math.sign(from.x-s.x),dy=-Math.sign(from.y-s.y);const opts=[[dx,0],[0,dy],[dx,dy?0:1],[dx,dy?0:-1],[dy?1:0,dy],[dy?-1:0,dy]].filter(d=>d[0]||d[1]);
    for(const d of opts){const nx=s.x+d[0],ny=s.y+d[1];if(inb(nx,ny)&&inZone(nx,ny)&&tryMove(s,d[0],d[1]))return true}return false}
  function stepToward(s,x,y){const dx=Math.sign(x-s.x),dy=Math.sign(y-s.y);if(Math.abs(x-s.x)>=Math.abs(y-s.y)){return tryMove(s,dx,0)||tryMove(s,0,dy)}return tryMove(s,0,dy)||tryMove(s,dx,0)}
  function nearestTile(s,pred,limit=14){let best=null,bd=99;for(let y=Math.max(0,s.y-limit);y<=Math.min(N-1,s.y+limit);y++)for(let x=Math.max(0,s.x-limit);x<=Math.min(N-1,s.x+limit);x++){if(!pred(x,y))continue;const d=Math.abs(x-s.x)+Math.abs(y-s.y);if(d<bd){bd=d;best=[x,y]}}return best}
  function zoneTarget(){const z=G.zoneTo||G.zone;return {x0:z.x0,y0:z.y0,side:z.side,cx:z.x0+z.side/2,cy:z.y0+z.side/2}}
  function safeIn(x,y,z,m){return x>=z.x0+m&&y>=z.y0+m&&x<z.x0+z.side-m&&y<z.y0+z.side-m}
  function ai(s,dt){s.aiT-=dt;if(s.aiT>0)return;s.aiT=0.2+rnd()*0.2;const st=stats(s),ag=s.F.ag;
    const foes=alive().filter(o=>o!==s&&o.owner!==s&&!(s.owner&&o===s.owner)&&canSee(s,o));
    // pick the target a player would: the weakest in reach, else the nearest
    let tgt=null,score=-1e9;foes.forEach(o=>{const d=dist(s,o);const sc=-d*3-o.hp/50+(o.f=="mojiang"?-30:0)+(o.f=="yuanmo"&&o.stage<3?C.HUNT_YM:0);if(sc>score){score=sc;tgt=o}});
    const best=tgt?dist(s,tgt):99;
    const hurt=s.hp<0.45*s.maxhp, rg=st.rg;
    // storm: keep a margin of 2 tiles inside the coming ring, move early when the ring is about to shrink
    const z=zoneTarget();const ph=C.STORM[G.phase];const soon=ph&&(G.zoneTo||ph[0]-G.phaseT<25);
    if(!inZone(s.x,s.y)||(soon&&!safeIn(s.x,s.y,z,2))){if(s.f=="mojiang"&&s.units<1){const t=G.turrets.find(t=>t.owner===s&&dist(s,t)<=1);if(t){skill(s,null)}}
      if(!stepToward(s,Math.round(z.cx),Math.round(z.cy))&&s.dashT<=0){const dx=Math.sign(z.cx-s.x),dy=Math.sign(z.cy-s.y);s.dir=Math.abs(z.cx-s.x)>Math.abs(z.cy-s.y)?[dx,0]:[0,dy];dash(s)}
      if(tgt&&best<=rg)attack(s,tgt);return}
    if(tgt){
      // fight-or-avoid decided once per encounter, from relative power and aggression; early game is cautious
      if(!s.decT||s.decT<G.t||s.decFoe!==tgt){s.decT=G.t+C.DECIDE;s.decFoe=tgt;const early=G.t<C.EARLY_PEACE;const edge=power(s)/(power(tgt)+1);
        s.fight=best<=rg||rnd()<ag*(early&&ag<0.8?0.25:C.AG_SCALE)*Math.min(2,edge)*(tgt.f=="yuanmo"&&tgt.stage<3?2.5:1)||edge>2.2||(tgt.f=="yuanmo"&&tgt.stage<3&&edge>0.8)}
      const run=hurt&&!(tgt.hp<s.hp*0.6)||!s.fight;
      if(run){ if(s.f=="mingjiang"&&s.sklT<=0&&s.cloak<=0)skill(s,null); if(s.f=="gushi"&&s.sklT<=0&&best<=3)skill(s,tgt);
        if(s.f=="yuanmo"&&s.dashT<=0&&best<=3){s.dir=[-Math.sign(tgt.x-s.x)||s.dir[0],0];if(!s.dir[0])s.dir=[0,-Math.sign(tgt.y-s.y)];dash(s)}
        if(!stepAway(s,tgt)&&best<=rg)attack(s,tgt);
        if(best>rg+1&&s.f!="mingjiang"&&s.dashT<=0&&stats(tgt).spd>st.spd){s.dir=[-Math.sign(tgt.x-s.x),0];if(!s.dir[0])s.dir=[0,-Math.sign(tgt.y-s.y)];dash(s)}return}
      // engage: faction openers
      switch(s.f){
        case "tianbing":if(best<=rg+1&&s.sklT<=0)skill(s,tgt);break;
        case "mingjiang":if(best>rg&&best<=4&&s.cloak<=0&&s.sklT<=0)skill(s,null);else if(best>rg&&s.cloak<=0&&s.sklT>0&&!inBush(s)){const b=nearestTile(s,(x,y)=>G.tiles[idx(x,y)]==T.BUSH&&inZone(x,y),5);if(b){stepToward(s,b[0],b[1]);return}}break;          // cloak on the approach for the 2x hit
        case "wushi":if(best<=3&&best>1&&s.sklT<=0)skill(s,tgt);break;                             // stun on the way in
        case "mojiang":if(s.units>=1&&s.sklT<=0){s.dir=[Math.sign(tgt.x-s.x)||0,Math.sign(tgt.x-s.x)?0:Math.sign(tgt.y-s.y)];skill(s,tgt)}       // turret toward the enemy
          else{const t=G.turrets.find(t=>t.owner===s);if(t&&dist(s,t)>1)stepToward(s,t.x,t.y);else if(best<=2)stepAway(s,tgt)}return;
        case "jianxian":if(best<=2&&s.sklT<=0)skill(s,tgt);break;
        case "tianlong":if(!inBush(s)){const b=nearestTile(s,(x,y)=>G.tiles[idx(x,y)]==T.BUSH&&inZone(x,y)&&Math.max(Math.abs(x-tgt.x),Math.abs(y-tgt.y))<=7,8);if(b&&best>2){stepToward(s,b[0],b[1]);break}} if(best<=rg)skill(s,tgt);break;
        case "gushi":if(s.sklT<=0&&best<=2)skill(s,tgt);break;
        case "yuanmo":if(best>rg&&best<=rg+3&&s.dashT<=0){s.dir=[Math.sign(tgt.x-s.x),0];if(!s.dir[0])s.dir=[0,Math.sign(tgt.y-s.y)];dash(s)}break;
      }
      if(best<=rg){attack(s,tgt);
        // kite: step out of the enemy's reach while the attack cools, if this suit outranges it or is faster
        const trg=stats(tgt).rg;if(s.atkT>0&&(rg>trg||st.spd>stats(tgt).spd*1.15)&&best<=trg)stepAway(s,tgt)}
      else if(best>rg&&!(s.f=="tianlong"&&inBush(s)&&best<=8))stepToward(s,tgt.x,tgt.y);
      return}
    // nobody in sight: heal in a bush if hurt, else grow on resources / wrecks, hide near the ring edge late
    s.decT=0;
    if(hurt&&!inBush(s)){const b=nearestTile(s,(x,y)=>G.tiles[idx(x,y)]==T.BUSH&&inZone(x,y),10);if(b){stepToward(s,b[0],b[1]);return}}
    if(hurt&&inBush(s))return;
    if(s.f=="mojiang"&&s.units>=1&&G.turrets.filter(t=>t.owner===s).length<2&&rnd()<0.3){skill(s,null);return}
    if(s.f=="gushi"&&s.sklT<=0&&(G.tiles[idx(s.x,s.y)]==T.RES)&&!G.decays.some(z=>z.x==s.x&&z.y==s.y)){skill(s,null)}
