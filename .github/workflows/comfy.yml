# SDXL base 1.0 + SDXL-Lightning on CPU GitHub runners (SUITS fa round 5, diffusers): full-figure concept reference images, never shipped. Push to ci-comfy-suitfa.
# Each matrix job (0-1 txt2img seeds, 2 img2img kit knight, 3 img2img kit rogue) runs ci/job.sh for one entry in ci_comfy/prompts.json; images are committed to ci-out under out/comfy/<run id>/job<N>/.
name: comfy-run
on:
  push:
    branches: ['ci-comfy-suitfa']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk (SDXL fp16 files about 7 GB plus the cache archive)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ckpt
          key: sdxl-base-fp16-lightning8-v1
      - name: Job
        run: |
          mkdir -p out_img; rc=0
          bash ci/job.sh ${{ matrix.job }} out_img > out_img/job.log 2>&1 || rc=$?
          tail -40 out_img/job.log; exit $rc
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/comfy-suitfa/${GITHUB_RUN_ID}/job${{ matrix.job }}
          mkdir -p /tmp/o && cp -r out_img/. /tmp/o/ 2>/dev/null || true
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch origin ci-out && git checkout -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/o/. $D/
          git add out && git commit -qm "comfy ${GITHUB_RUN_ID} job${{ matrix.job }}"
          for k in 1 2 3 4 5; do git push origin ci-out && break; git pull --rebase origin ci-out; done
