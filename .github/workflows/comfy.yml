# SDXL base 1.0 + SDXL-Lightning on CPU GitHub runners (SUITS fa round 5, diffusers): full-figure concept reference images, never shipped. Push to ci-comfy-suitfa.
# Each matrix job (0: seeds 7101-7102 + img2img kit knight, 1: seeds 7103-7104 + img2img kit rogue; 2 jobs, not 4: in runs 45538983377 and
# 45542072933 two of four jobs stalled in the Job step with no output, guess: concurrent model download) runs ci/job.sh for one entry in ci_comfy/prompts.json; images are committed to ci-out under out/comfy/<run id>/job<N>/.
name: comfy-run
on:
  push:
    branches: ['ci-comfy-suitfa']
permissions:
  contents: write
  actions: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk (SDXL fp16 files about 7 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      # lead 25 Nov: the ~7 GB SDXL cache pushed the repo past the 10 GB Actions cache limit; the model downloads in about 62 s instead
      - name: Drop the SDXL actions cache and log cache totals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out_img
          gh cache delete sdxl-base-fp16-lightning8-v1 --repo heavenfort77-cpu/Empress-decrees- || true
          gh cache list --repo heavenfort77-cpu/Empress-decrees- --limit 100 --json key,sizeInBytes,ref --jq '"caches \(length), total \((map(.sizeInBytes) | add // 0) / 1048576 | floor) MB", (.[] | "\(.key) \(.ref) \(.sizeInBytes / 1048576 | floor) MB")' | tee out_img/cache_list.txt || echo "gh cache list failed" | tee out_img/cache_list.txt
      - name: Job
        run: |
          mkdir -p out_img; rc=0
          bash ci/job.sh ${{ matrix.job }} out_img 2>&1 | tee out_img/job.log; rc=${PIPESTATUS[0]}
          exit $rc
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/comfy-suitfa/${GITHUB_RUN_ID}/job${{ matrix.job }}
          mkdir -p /tmp/o && cp -r out_img/. /tmp/o/ 2>/dev/null || true
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch origin ci-out && git checkout -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/o/. $D/
          git add out && git commit -qm "comfy ${GITHUB_RUN_ID} job${{ matrix.job }}"
          for k in 1 2 3 4 5; do git push origin ci-out && break; git pull --rebase origin ci-out; done
