# Runs on GitHub's Linux runners when the branch ci-run is pushed (never on main or batches-3-5).
# ci/job.json says what to run: mode "mut" = one job per mutation, each runs the full suite (tests/run.mjs);
# mode "suite" = one full suite run with -sims; mode "cmd" = one shell command (probe scripts in the tree), its output kept. Results are committed to the branch ci-out under out/<label>/<run id>/.
name: ci-run
on:
  push:
    branches: [ci-run, 'ci-run-*']
permissions:
  contents: write
jobs:
  plan:
    # Only commits made by ci_mut.sh (message "ci job ...") start a run; tool commits on this branch do not.
    if: startsWith(github.event.head_commit.message, 'ci job')
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
      label: ${{ steps.p.outputs.label }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 -c "import json;j=json.load(open('ci/job.json'));n=len(j.get('muts',[])) if j['mode']=='mut' else int(j.get('shards',1)) if j['mode']=='shard' else 1;print('idx='+json.dumps(list(range(n))));print('label='+j['label'])" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npm i --no-save --no-audit --no-fund playwright@1.63.0 acorn@8 && npx playwright install --with-deps chromium
      - name: Preflight (RUNNERS.md RULE; fails in the first minute)
        run: |
          set -e; mkdir -p results
          command -v node python3; node -e "require('playwright').chromium.executablePath() && console.log('chromium ok')"
          node -e "import('acorn').then(() => console.log('acorn ok'))"
          for f in index.html tests/run.mjs tests/static-check.mjs ci/job.json ci/apply_mut.py ci/shard.mjs ci/summarise.py; do test -f "$f" || { echo "PREFLIGHT missing $f"; exit 1; }; done
          for d in lib tests; do test -d "$d" || { echo "PREFLIGHT missing dir $d"; exit 1; }; done
          if grep -q "lib/jsm" index.html; then test -f lib/jsm/loaders/KTX2Loader.js && test -f lib/jsm/libs/basis/basis_transcoder.wasm || { echo "PREFLIGHT missing lib/jsm"; exit 1; }; fi
          if grep -q "assets/c/manifest.json" index.html; then test -f assets/c/manifest.json || { echo "PREFLIGHT missing assets/c/manifest.json"; exit 1; }; fi
          test -z "$(git ls-files '*.pyc' '*/__pycache__/*' tests/run_shard.mjs)" || { echo "PREFLIGHT tracked build files"; git ls-files '*.pyc' tests/run_shard.mjs; exit 1; }
          python3 - <<'PY'
          import json, sys
          j = json.load(open('ci/job.json', encoding='utf-8')); src = open('index.html', encoding='utf-8').read()
          if j['mode'] == 'mut':
              bad = [m['name'] for m in j['muts'] if src.count(m['a']) != 1]
              if bad: print('PREFLIGHT mutation targets not found exactly once:', bad); sys.exit(1)
              print('mutation targets', len(j['muts']), 'ok')
          PY
          echo PREFLIGHT PASS
      - name: Run
        run: |
          mkdir -p results
          MODE=$(python3 -c "import json;print(json.load(open('ci/job.json'))['mode'])")
          T0=$(date +%s)
          if [ "$MODE" = cmd ]; then
            CMD=$(python3 -c "import json;print(json.load(open('ci/job.json'))['cmd'])")
            bash -c "$CMD" > out.txt 2>&1 || true
          elif [ "$MODE" = shard ]; then
            NS=$(python3 -c "import json;print(json.load(open('ci/job.json')).get('shards',1))")
            node ci/shard.mjs ${{ matrix.i }} $NS -sims -v > out.txt 2>&1 || true
          elif [ "$MODE" = mut ]; then
            python3 ci/apply_mut.py ${{ matrix.i }} > apply.txt 2>&1 || true
            node tests/run.mjs > out.txt 2>&1 || true
          else
            node tests/run.mjs -sims > out.txt 2>&1 || true
          fi
          python3 - "$MODE" ${{ matrix.i }} $T0 <<'PY'
          import json, re, sys, time
          mode, i, t0 = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          out = open('out.txt').read()
          fails = re.findall(r'^FAIL (\S+)', out, re.M); tot = re.findall(r'RUNTIME .*', out)
          r = {'i': i, 'fails': fails, 'tot': tot, 's': round(time.time() - t0)}
          if mode == 'mut':
              m = json.load(open('ci/job.json', encoding='utf-8'))['muts'][i]
              ap = open('apply.txt').read().strip()
              r.update({'name': m['name'], 'want': m['want'], 'applied': ap.startswith('applied'), 'caught_named': m['want'] in fails})
          elif mode == 'cmd':
              r['tail'] = out[-6000:]
          elif mode == 'shard':
              r['oks'] = re.findall(r'^ok\s+(\S+)', out, re.M); r['shard'] = re.findall(r'^SHARD .*', out, re.M)
              r['stmt'] = re.findall(r'^STMT (\d+) (\d+)', out, re.M); r['sims'] = re.findall(r'^SIM .*', out, re.M); r['faillines'] = re.findall(r'^FAIL .*', out, re.M)
          else:
              r['sims'] = re.findall(r'^SIM .*', out, re.M); r['faillines'] = re.findall(r'^FAIL .*', out, re.M)
          json.dump(r, open(f'results/r{i}.json', 'w'), ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r${{ matrix.i }}
          path: |
            results/
            out.txt
          retention-days: 1
  summary:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Summarise and commit to ci-out
        run: |
          mkdir -p results && cp -r art/*/results/* results/ 2>/dev/null || true
          python3 ci/summarise.py
          D=out/${{ needs.plan.outputs.label }}/${{ github.run_id }}
          mkdir -p /tmp/res/$D && cp summary.json summary.txt /tmp/res/$D/; cp shard_times.json /tmp/res/$D/ 2>/dev/null || true
          for d in art/*/; do n=$(basename $d); [ -f $d/out.txt ] && cp $d/out.txt /tmp/res/$D/$n.out.txt; done
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch origin ci-out
          git checkout -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/res/$D/* $D/
          git add out && git commit -qm "ci-run ${{ github.run_id }} ${{ needs.plan.outputs.label }}"
          for k in 1 2 3; do git push origin ci-out && break; git pull --rebase origin ci-out; done
