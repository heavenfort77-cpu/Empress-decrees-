# AUDIO renders on a GitHub runner (headless Chromium OfflineAudioContext, numpy + pyloudnorm gates). Triggered by a push to ci-audio.
# Results are committed to ci-out under out/audio/ci-audio/<run id>/ (job.log, preview/, wav/phone/, stats.json).
name: audio-run
on:
  push:
    branches: ['ci-audio']
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          python -m pip install -q numpy pyloudnorm
          npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Job
        env:
          OUT: ${{ github.workspace }}/ci_audio_out
        run: mkdir -p "$OUT" && bash ci_audio/job.sh 2>&1 | tee "$OUT/job.log"
      - name: Commit to ci-out
        if: always()
        run: |
          B=${GITHUB_REF_NAME}; D=out/audio/$B/${GITHUB_RUN_ID}
          mkdir -p /tmp/o && cp -r ci_audio_out/. /tmp/o/ 2>/dev/null || true
          git checkout -q -- . 2>/dev/null; git clean -qfd 2>/dev/null
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch -q origin ci-out && git checkout -q -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/o/. $D/
          git add out && git commit -qm "audio $B ${GITHUB_RUN_ID}" || true
          for k in 1 2 3 4 5 6; do git push -q origin ci-out && break; sleep $((RANDOM % 8 + 2)); git pull -q --rebase origin ci-out; done
