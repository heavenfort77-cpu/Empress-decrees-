# PREP-PAL proofs for src/palace_art.js (branch prep-pal only; never on main or batches-3-5). Linux: checks P0-P20 and mutant shards on
# SwiftShader (correctness and counts only); macOS: real-GPU timing against the game's reference scene in the same job, and memory cycles.
# A commit message containing [preflight] runs only the PREFLIGHT step of each job. Outputs go to branch ci-out under out/prep-pal/<run id>/.
name: prep-pal
on:
  push:
    branches: [prep-pal]
permissions:
  contents: write
concurrency:
  group: prep-pal
  cancel-in-progress: false
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        part: [checks, mut0, mut1, mut2, mut3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Preflight
        run: bash ci/job.sh preflight 2>&1 | tee preflight.txt
      - name: Run
        if: ${{ !contains(github.event.head_commit.message, '[preflight]') }}
        run: |
          P=${{ matrix.part }}
          if [ "$P" = "checks" ]; then bash ci/job.sh checks; else bash ci/job.sh mutants ${P#mut}/4; fi
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/prep-pal/${GITHUB_RUN_ID}/${{ matrix.part }}
          mkdir -p /tmp/o && cp -r pal_out/. /tmp/o/ 2>/dev/null || true; cp preflight.txt /tmp/o/ 2>/dev/null || true
          set +e
          git checkout -q -- . 2>/dev/null; git clean -qfd 2>/dev/null
          git config user.name Claude && git config user.email noreply@anthropic.com
          for k in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth 1 origin ci-out && git checkout -q -B ci-out FETCH_HEAD && mkdir -p $D && cp -r /tmp/o/. $D/ \
              && echo "sha ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" > $D/meta.txt && git add out && git commit -qm "prep-pal ${{ matrix.part }} ${GITHUB_RUN_ID}" \
              && git push -q origin ci-out && { echo "ci-out pushed (try $k)"; break; }
            sleep $((RANDOM % 9 + 3 * k))
          done
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null && npx playwright install chromium >/dev/null
      - name: Machine
        run: (sysctl -n machdep.cpu.brand_string; system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution" || true) | tee machine.txt
      - name: Preflight
        run: bash ci/job.sh preflight 2>&1 | tee preflight.txt
      - name: Perf (real GPU, vsync off)
        if: ${{ !contains(github.event.head_commit.message, '[preflight]') }}
        run: bash ci/job.sh perf
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/prep-pal/${GITHUB_RUN_ID}/mac
          mkdir -p /tmp/o && cp -r pal_out/. /tmp/o/ 2>/dev/null || true; cp machine.txt preflight.txt /tmp/o/ 2>/dev/null || true
          set +e
          git checkout -q -- . 2>/dev/null; git clean -qfd 2>/dev/null
          git config user.name Claude && git config user.email noreply@anthropic.com
          for k in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth 1 origin ci-out && git checkout -q -B ci-out FETCH_HEAD && mkdir -p $D && cp -r /tmp/o/. $D/ \
              && echo "sha ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" > $D/meta.txt && git add out && git commit -qm "prep-pal mac ${GITHUB_RUN_ID}" \
              && git push -q origin ci-out && { echo "ci-out pushed (try $k)"; break; }
            sleep $((RANDOM % 9 + 3 * k))
          done
