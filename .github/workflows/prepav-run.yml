# PREP-AV (fxEvent + painted cards + sound + options menu): checks and the mutation round on Linux (headless Chromium, software GPU:
# correctness only), real-GPU timing on macOS (ANGLE Metal) against the reference in the same job. Triggered by a push to prep-av only.
# Output is committed to ci-out under out/prepav/<run id>/linux and /mac (artifact downloads may be blocked).
name: prepav-run
on:
  push:
    branches: [prep-av]
permissions:
  contents: write
concurrency:
  group: prepav-run
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Job (ci/job.sh linux; PREFLIGHT first)
        env:
          PREFLIGHT_ONLY: ${{ contains(github.event.head_commit.message, '[preflight-only]') && '1' || '0' }}
        run: bash ci/job.sh linux
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/prepav/${GITHUB_RUN_ID}/linux
          mkdir -p /tmp/o && cp -r o/. /tmp/o/ 2>/dev/null || true; cp preflight.txt /tmp/o/ 2>/dev/null || true
          git checkout -q -- . 2>/dev/null; git clean -qfd 2>/dev/null
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch -q origin ci-out && git checkout -q -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/o/. $D/
          echo "sha ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" > $D/meta.txt
          git add out && git commit -qm "prepav linux ${GITHUB_RUN_ID}" || true
          for k in 1 2 3 4 5 6; do git push -q origin ci-out && break; sleep $((RANDOM % 8 + 2)); git pull -q --rebase origin ci-out; done
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install chromium
      - name: Machine
        run: (sysctl -n machdep.cpu.brand_string; system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution" || true) | tee machine.txt
      - name: Job (ci/job.sh mac; PREFLIGHT first)
        env:
          PREFLIGHT_ONLY: ${{ contains(github.event.head_commit.message, '[preflight-only]') && '1' || '0' }}
        run: bash ci/job.sh mac
      - name: Commit to ci-out
        if: always()
        run: |
          D=out/prepav/${GITHUB_RUN_ID}/mac
          mkdir -p /tmp/o && cp -r mac_out/. /tmp/o/ 2>/dev/null || true; cp machine.txt preflight.txt /tmp/o/ 2>/dev/null || true
          git config user.name Claude && git config user.email noreply@anthropic.com
          git fetch -q origin ci-out && git checkout -q -B ci-out origin/ci-out
          mkdir -p $D && cp -r /tmp/o/. $D/
          echo "sha ${GITHUB_SHA} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" > $D/meta.txt
          git add out && git commit -qm "prepav mac ${GITHUB_RUN_ID}" || true
          for k in 1 2 3 4 5 6; do git push -q origin ci-out && break; sleep $((RANDOM % 8 + 2)); git pull -q --rebase origin ci-out; done
