<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audio harness</title></head><body>
<script type="module">
// Test page for src/audio/sound.js: renders sounds, loops and the ramp offline and hands back 16-bit WAVs plus float stats.
import * as A from '../src/audio/sound.js';
function wav(x, sr) {
  const n = x.length, b = new ArrayBuffer(44 + n * 2), dv = new DataView(b), w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, x[i] || 0)); dv.setInt16(44 + i * 2, v < 0 ? v * 32768 : v * 32767, true); }
  const u = new Uint8Array(b); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function stats(x) { let nan = 0, clip = 0, peak = 0; for (let i = 0; i < x.length; i++) { const v = x[i]; if (!Number.isFinite(v)) { nan++; continue; } const a = Math.abs(v); if (a >= 0.999) clip++; if (a > peak) peak = a; } return { nan, clip, peak, len: x.length }; }
const loopCache = {};
// Counts noise sources: the only AudioBufferSourceNodes an effect or loop render makes are its noise layers (phones must make none).
let srcCount = 0; const OACp = (window.OfflineAudioContext || window.webkitOfflineAudioContext).prototype, mk = OACp.createBufferSource;
OACp.createBufferSource = function () { srcCount++; return mk.call(this); };
window.H = {
  list: () => Object.keys(A.SOUNDS).map((k) => ({ name: k, cat: A.SOUNDS[k].cat })),
  loops: () => Object.keys(A.LOOPS),
  config: () => JSON.parse(JSON.stringify(A.CONFIG)),
  notes: () => A.noteTable(),
  sound: async (name, sr, profile) => { srcCount = 0; const t = performance.now(), x = await A.renderSound(name, sr, profile); return Object.assign(stats(x), { noiseSrc: srcCount, ms: performance.now() - t, b64: wav(x, sr) }); },
  loop: async (name, sr, profile, mode) => { srcCount = 0; const t = performance.now(), x = await A.renderLoop(name, sr, profile, mode ? { [mode]: true } : undefined); if (!mode) loopCache[profile + sr + name] = x; return Object.assign(stats(x), { noiseSrc: srcCount, ms: performance.now() - t, b64: wav(x, sr) }); },
  ramp: async (sr, seconds, profile) => { const L = {}; for (const k of Object.keys(A.LOOPS)) L[k] = loopCache[profile + sr + k] || await A.renderLoop(k, sr, profile); const t = performance.now(), x = await A.renderRamp(sr, seconds, profile, L); return Object.assign(stats(x), { ms: performance.now() - t, b64: wav(x, sr) }); },
};
window.HREADY = true;
</script></body></html>
