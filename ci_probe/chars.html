  const st = crowd.makeState(t, i); crowd.setClip(st, 'move', -k * 0.37);

}

for (const u of RIGS) { u.rig.show(sc); u.rig.play(u.rig.actions.idle ? 'idle' : 'move'); }
// Warm-up under a black frame: every rig and batch drawn once (compile + upload), then the shadow map once.
